<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan Pádel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan Pádel">
<meta name="theme-color" content="#080e1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* "Pista de noche": tema oscuro único y deliberado. Azul césped = información; amarillo pelota = lo que se toca.
   Layout: app de una columna (máx. 520px), pestañas fijas abajo, modo sesión a pantalla completa por encima. */
:root{
  --ink:#080e1a; --surface:#111929; --surface2:#1a243a; --line:rgba(255,255,255,.07);
  --court:#3f7df4; --ball:#d9ea4c; --ballInk:#1a220a; --text:#ecf0f7; --muted:#92a0bb;
  --ok:#52cf90; --warn:#f5a844; --heart:#fa6672;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",-apple-system,system-ui,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--text)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ball);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:12px calc(100px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big{font:800 46px/1 var(--display);letter-spacing:.005em;margin:2px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.ballbtn{width:100%;padding:17px;border-radius:18px;background:var(--ball);color:var(--ballInk);font:800 22px var(--display);letter-spacing:.04em;text-transform:uppercase;transition:transform .15s}
.ballbtn:active{transform:scale(.97)}
.ghostbtn{padding:14px;border-radius:16px;background:var(--surface2);font-weight:600;width:100%}
.title{font:800 34px/1.02 var(--display);margin:0;text-wrap:balance}
.h3{font:800 20px var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}

/* Fase ATR */
.atr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.atr div{background:var(--surface);border-radius:14px;padding:10px 12px;color:var(--muted);font-size:11px;font-weight:500}
.atr b{display:block;font:800 26px/1 var(--display)}
.atr .on{background:var(--court);color:var(--ink)}
.weeks{display:flex;align-items:center;gap:8px;margin-top:10px}
.weeks i{flex:1;height:4px;border-radius:4px;background:var(--surface2)}
.weeks i.on{background:var(--court)}

/* Salud */
.health{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric b{font:700 22px var(--body);font-variant-numeric:tabular-nums}
.metric small{font-size:10px;font-weight:600;color:var(--muted);margin-left:2px}
.metric div{font-size:11px;font-weight:500;margin-top:1px}

/* Bloques */
.ex-row{display:grid;grid-template-columns:8px 1fr 32px;gap:12px;align-items:start;padding:6px 0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--court);margin-top:8px}
.play{width:32px;height:32px;border-radius:50%;background:var(--ball);color:var(--ballInk);display:grid;place-items:center;text-decoration:none}
.play svg{width:12px;height:12px}
.last{font-size:12px;color:var(--ball);opacity:.85}

/* Semana */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;margin-top:6px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;gap:2px}
.bar i{display:block;border-radius:5px}
.bar span{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.day{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:12px;border-radius:16px;align-items:start}
.day.today{background:rgba(26,36,58,.7)}
.day .d{text-align:center}
.day .d small{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.day .d b{font:700 24px var(--body);font-variant-numeric:tabular-nums}

/* Progreso */
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.hscroll::-webkit-scrollbar{display:none}
.best{display:flex;align-items:baseline;gap:6px}
.best b{font:700 48px var(--body);font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}

/* Pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(17,25,41,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--ball)}

/* Pantallas superpuestas */
.overlay{position:fixed;inset:0;z-index:40;background:var(--ink);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up .3s ease}
.overlay .inner{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:16px;height:16px}
.topbar{display:flex;align-items:center;justify-content:space-between}
.prog{display:flex;gap:3px;margin-top:14px}
.prog i{flex:1;height:5px;border-radius:5px;background:var(--surface2)}
.prog i.done{background:var(--court)}
.prog i.now{background:var(--ball)}
.scroll{flex:1;overflow-y:auto;min-height:0;padding:18px 0 8px;scrollbar-width:none}
.exname{font:800 42px/1 var(--display);margin:6px 0 8px;text-wrap:balance}
.vid{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--ball);color:var(--ballInk);font-weight:600;font-size:14px;text-decoration:none}
.vid svg{width:12px;height:12px}
.stepper{display:grid;grid-template-columns:auto 1fr 46px minmax(64px,auto) 46px;align-items:center;gap:8px;padding:6px 0}
.stepper .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stepper .lab small{display:block;font-size:10px;font-weight:500;letter-spacing:0;text-transform:none}
.stepper button{width:50px;height:50px;border-radius:14px;background:var(--surface2);font-size:24px;font-weight:600}
.stepper button:active{background:#25324e}
.stepper output{font:700 40px var(--body);font-variant-numeric:tabular-nums;min-width:92px;text-align:center}
.rest{position:fixed;inset:0;z-index:50;background:rgba(8,14,26,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ring{position:relative;width:240px;height:240px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring output{position:absolute;inset:0;display:grid;place-items:center;font:700 64px var(--body);font-variant-numeric:tabular-nums}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet .panel{background:var(--surface);width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;border-radius:26px 26px 0 0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;animation:up .3s ease}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe button{padding:12px 0;border-radius:12px;background:var(--surface2);font:700 22px var(--body)}
.rpe button[aria-pressed="true"]{background:var(--court);color:var(--ink)}
.field{background:var(--surface2);border-radius:16px;padding:12px 14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field textarea{width:100%;background:none;border:0;outline:0;padding:2px 0}
.field input{font:700 28px var(--body);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--surface2);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;animation:up .25s ease}
/* Récord, resumen y anillos */
.pr-banner{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:120;width:min(92vw,420px);box-sizing:border-box;background:linear-gradient(135deg,#f7d95c,#d9ea4c 55%,#f5a844);color:#1a220a;padding:12px 18px;border-radius:18px;box-shadow:0 12px 40px rgba(217,234,76,.35);font:800 20px var(--display);letter-spacing:.02em;text-transform:uppercase;display:flex;gap:10px;align-items:center;max-width:92vw;animation:prIn .5s cubic-bezier(.2,1.4,.4,1)}
.pr-banner small{display:block;font:600 13px var(--body);text-transform:none;letter-spacing:0;opacity:.85}
@keyframes prIn{from{transform:translate(-50%,-40px) scale(.8);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}
.summary{position:fixed;inset:0;z-index:75;overflow-y:auto;background:radial-gradient(120% 70% at 50% 0%,#17306b 0%,#0b1630 45%,var(--ink) 100%);display:flex;flex-direction:column;align-items:center;gap:16px;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));animation:fade .3s ease}
.summary .inner{width:100%;max-width:460px;display:flex;flex-direction:column;gap:16px}
.summary h2{font:800 46px/1 var(--display);text-transform:uppercase;margin:0;letter-spacing:.01em}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sgrid div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:14px;animation:up .5s ease both}
.sgrid b{display:block;font:800 38px/1 var(--display);font-variant-numeric:tabular-nums}
.sgrid span{font-size:12px;color:var(--muted);font-weight:600}
.prlist{background:linear-gradient(135deg,rgba(247,217,92,.16),rgba(245,168,68,.10));border:1px solid rgba(247,217,92,.35);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;animation:up .6s .2s ease both}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:76}
.rings{display:flex;align-items:center;gap:18px}
.rings svg{flex:none;width:118px;height:118px;transform:rotate(-90deg)}
.ring-p{transition:stroke-dashoffset 1.3s cubic-bezier(.3,.9,.3,1)}
.rl{display:flex;flex-direction:column;gap:9px;min-width:0}
.rl div{display:flex;flex-direction:column}
.rl b{font:700 18px var(--body);font-variant-numeric:tabular-nums}
.rl span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.report{position:fixed;inset:0;z-index:78;overflow-y:auto;background:var(--ink);padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));animation:fade .25s ease}
.report .rp{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.report section{display:flex;flex-direction:column;gap:8px}
.report h3{font:700 16px var(--body);margin:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div,.rbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.kpis b{display:block;font:800 26px/1.1 var(--display)}
.kpis span{font-size:11px;color:var(--muted);font-weight:600}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.tbl table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:600;font-size:11px}
.tbl td.lo{color:#fa6672;font-weight:700}
.tbl table.acts td:nth-child(2),.tbl table.acts th:nth-child(2){text-align:left}
@media print{
  @page{margin:14mm}
  body{background:#fff!important}
  body>*:not(#report){display:none!important}
  #report{position:static;inset:auto;overflow:visible;background:#fff!important;color:#111!important;padding:0}
  #report *{color:#111!important;border-color:#ccc!important}
  #report .kpis div,#report .rbox{background:#f5f6f8!important}
  #report .noprint{display:none!important}
  #report td.lo{color:#c0263a!important}
  #report section{break-inside:avoid}
}
.sheet .panel>*{flex-shrink:0}
.field input[type=date],.field input[type=time]{font-size:17px!important;font-weight:600!important;min-width:0;width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main class="wrap" id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Secciones">
  <div class="in" role="tablist">

    <button role="tab" data-tab="semana" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Semana</button>
    <button role="tab" data-tab="progreso" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/></svg>Progreso</button>
  </div>
</nav>

<div id="layer"></div>

<script>
/* ============ PLAN · BLOQUE 1 (4 semanas desde el lunes 23-11-2026) ============
   Hecho a partir de tus registros reales con Marcfit, solo con el material de tu gimnasio
   (cardio: cinta, elíptica y bici estática) y con la rodilla derecha en mente.
   Semana 1: aprendes los pesos (RIR +1) · Semana 2: la que está escrita · Semana 3: la más dura (RIR −1)
   Semana 4: descarga (una serie menos y RIR +2). */
const PHASES=[{k:"A",n:"Acumulación",g:"Base: fuerza en tus ejercicios ancla, rodilla y aeróbico"},{k:"T",n:"Transformación",g:"Convertir la base en potencia y velocidad"},{k:"R",n:"Realización",g:"Intensidad de partido, menos volumen"}];
const BLOCK_START=new Date(2026,10,23);
const WEEK_INFO={1:{t:"Semana 1 · aprendes los pesos",rir:1,sets:0},2:{t:"Semana 2 · carga normal",rir:0,sets:0},3:{t:"Semana 3 · la más exigente",rir:-1,sets:0},4:{t:"Semana 4 · descarga",rir:2,sets:-1}};
function blockWeek(d=new Date()){const days=Math.round((monday(d)-monday(BLOCK_START))/86400000);return Math.min(4,Math.max(1,Math.floor(days/7)+1))}
const BLOCK={phase:"A",get week(){return blockWeek()},weeks:4};

/* presc admite {S} (series de esa semana) y {R} (RIR de esa semana) */
const ex=(id,name,presc,cue,video,sets,metrics,defaults,rest,barbell=false,opt={})=>({id,name,presc,cue,video,sets,metrics,defaults,rest,barbell,...opt});
const WARMUP=[
 {id:"cal",title:"Calentamiento competitivo · 8 min",note:"Antes de pelotear",ex:[
  ex("cal-movil","Movilidad dinámica","Cadera, tobillo y hombro · 2 min","Todo en movimiento, nada de estiramientos quietos.","padel dynamic warm up",1,["seg"],{seg:120},0),
  ex("cal-activ","Activación","10 sentadillas + 10 zancadas + 10 W con goma","Ritmo vivo.","dynamic warm up squat lunge",1,["reps"],{reps:30},0),
  ex("cal-chispa","Chispa","3 salidas laterales + 3 saltos + 3 frenadas por lado","Cada vez más rápido. Termina con pulsaciones altas.","padel warm up footwork",1,["reps"],{reps:9},0)]},
 {id:"post",title:"Después del partido · 10 min",note:"Nada más salir de la pista",ex:[
  ex("post-lumbar","Descarga lumbar","Rodillas al pecho y rotaciones tumbado · 3 min","Respira lento.","lower back decompression after sport",1,["seg"],{seg:180},0),
  ex("post-rodillo","Rodillo","Gemelos, cuádriceps y glúteo · 5 min","Sin buscar dolor.","foam roll after match",1,["seg"],{seg:300},0)]}];

const SESSION_A={id:"A",wd:1,title:"A · Pierna: primer paso, fuerza y rodilla",sub:"La sesión más pesada de la semana. Si hoy juegas, que sea a las 20:00, nunca a mediodía.",kinds:["gym"],gym:55,padel:0,rpe:[7,8],warn:"Pierna pesada y saltos: mide la glucosa antes de empezar.",blocks:[
 {id:"a0",title:"Calentamiento",note:"1 vuelta · 7 min",ex:[
  ex("a-bici","Bici estática","2 min suave","Pedalea fácil, que puedas hablar.","stationary bike warm up",1,["seg"],{seg:120},0),
  ex("a-tobillo","Movilidad de tobillo con goma","10 por pierna","Rodilla hacia delante sin levantar el talón.","ankle mobility band knee to wall",1,["reps"],{reps:10},0),
  ex("a-9090","Cadera 90/90","6 cambios por lado","El giro sale de la cadera, espalda recta.","90 90 hip switch mobility",1,["reps"],{reps:6},0),
  ex("a-monster","Paso lateral con goma (monster walk)","10 pasos por lado","Goma por encima de las rodillas. Las rodillas empujan hacia fuera: así se activa el glúteo medio, que sujeta tu rótula.","monster walk band glute medius",1,["reps"],{reps:10},0)]},
 {id:"a0b",title:"Primer paso y rampa",note:"Superserie · 3 rondas · con las piernas frescas",ex:[
  ex("lateral-sprint","Salida desde la posición de espera","{S} × 3 salidas de 3-5 m: al frente, lateral y en diagonal hacia atrás","Como en la red: split-step y primer paso explosivo. Cada salida al 100 % y vuelves andando. Así se gana el 80 % de los desplazamientos del pádel, que son de 1-2 m.","lateral shuffle to sprint drill",3,["reps"],{reps:3},15),
  ex("sprint-rampa","Sprint en rampa","{S} × 1 de 10 m cuesta arriba","Marca 10 m en tu rampa (tiene más de 20). Cuerpo inclinado, empuja el suelo hacia atrás con pasos potentes. Vuelve andando despacio.","hill sprint acceleration",3,["reps"],{reps:1},45)]},
 {id:"a1",title:"Fuerza + salto",note:"Contraste · 4 rondas",ex:[
  ex("sentadilla","Sentadilla trasera","{S} × 5 · RIR {R}","Con barra libre en la jaula y las barras de seguridad un poco por debajo de tu sentadilla. Baja controlado, rodillas en la línea de los pies y sube rápido. Apunta solo los discos.","back squat technique",4,["kg","reps","RIR"],{kg:40,reps:5,RIR:3},20,true),
  ex("a-cajon","Salto al cajón","{S} × 3 · máxima altura","Cae suave sobre el cajón, rodillas hacia fuera. Baja andando, no saltando.","box jump landing technique",4,["reps"],{reps:3},120)]},
 {id:"a2",title:"Cadena posterior",note:"Superserie · 3 rondas",ex:[
  ex("rdl","Peso muerto rumano con barra","{S} × 6 · RIR {R}","Cadera atrás, barra pegada a las piernas, espalda larga. Para cuando notes el isquio estirado.","romanian deadlift technique",3,["kg","reps","RIR"],{kg:40,reps:6,RIR:3},20,true),

/* Ajusta una sesión a la semana del bloque, a la versión corta y al «compito mañana» */
function materialize(day,date=new Date(),opts={}){
  const w=blockWeek(date), W=WEEK_INFO[w];
  let base=day;
  if(day.id==="D"&&opts.compete)base=ACTIVATION;
  let blocks=base.blocks.map(b=>({...b,ex:b.ex.map(e=>{
    const multi=e.sets>1;
    const sets=multi?Math.max(1,e.sets+W.sets):e.sets;
    const d={...e.defaults};
    if(d.RIR!=null)d.RIR=Math.max(e.rirMin??0,d.RIR+W.rir);
    const presc=e.presc.replace("{S}",sets).replace("{R}",d.RIR??"");
    return {...e,sets,defaults:d,presc};
  })}));
  if(opts.short){
    blocks=blocks.filter((b,i)=>i===0||b.id.endsWith("1")||b.id.endsWith("2")).map(b=>({...b,ex:b.ex.map(e=>({...e,sets:Math.min(e.sets,2),presc:e.presc.replace(/^\d+ ×/,Math.min(e.sets,2)+" ×")}))}));
  }
  return {...base,blocks,week:w,weekText:W.t,short:!!opts.short};
}
/* Duración estimada: trabajo de cada serie + descansos + 20" por cambio de ejercicio + 2' por bloque */
function estimateMinutes(day){
  let s=0;
  day.blocks.forEach(b=>{s+=120;b.ex.forEach(e=>{
    const work=e.defaults.seg?e.defaults.seg:(e.defaults.reps||5)*4;
    s+=e.sets*(work+20+e.rest);
  })});
  return Math.round(s/60);
}

const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const monday=(d=new Date())=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const dateOf=wd=>{const m=monday();m.setDate(m.getDate()+wd-1);return m};
const dayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dayOpts=()=>((S.opts||{})[dayKey()])||{};

/* Competiciones (torneos y liga) que apuntas en Semana */
const localKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const compOn=d=>{const k=localKey(d);return (S.comps||[]).find(c=>k>=c.from&&k<=(c.to||c.from))};
const effCompete=()=>{const o=dayOpts();return o.compete!=null?!!o.compete:!!compOn(addDays(new Date(),1))};
const today=()=>{const o=dayOpts(),sw=o.swap&&DAYS.find(x=>x.id===o.swap),nat=DAYS[(new Date().getDay()+6)%7];
  let base=sw||(compOn(new Date())&&nat.gym?DAYS[5]:nat); /* el día que compites, nada de gimnasio: calentamiento competitivo */
  if(!sw&&base.id==="A"&&effCompete())base=SESSION_B; /* la víspera de competir, nada de pierna pesada */
  return materialize(base,new Date(),{...o,compete:effCompete()})};

/* ============ REORGANIZAR LA SEMANA (si un día no entrenas) ============
   Reglas: A y D (pierna) primero; nunca pierna dos días seguidos, ni el jueves (entrenador),
   ni a menos de 6 h de jugar, ni el día antes de competir. Las sesiones futuras no se adelantan. */
const GYM_IDS=["A","B","C","D"], PRIO=["A","D","B","C"], LEGS=new Set(["A","D"]);
const natWd=id=>DAYS.find(d=>d.id===id).wd;
const dayName=wd=>["","lunes","martes","miércoles","jueves","viernes","sábado","domingo"][wd];
const gymIdOf=s=>s.dayId==="D-act"?"D":s.dayId;
function weekState(now=new Date()){
  const m=monday(now), todayWd=(now.getDay()+6)%7+1;
  const wkS=S.sessions.filter(s=>s.status!=="en curso"&&new Date(s.start)>=m);
  const doneIds=new Set(wkS.map(gymIdOf));
  const skipped=new Set(((S.skip||{})[dayKey(m)])||[]);
  const missed=m<monday(BLOCK_START)?[]:GYM_IDS.filter(id=>natWd(id)<todayWd&&!doneIds.has(id)&&!skipped.has(id));
  const doneToday=wkS.filter(s=>sameDay(new Date(s.start),now)).map(gymIdOf).find(id=>GYM_IDS.includes(id));
  const y=new Date(now);y.setDate(y.getDate()-1);
  const legsYesterday=wkS.some(s=>sameDay(new Date(s.start),y)&&LEGS.has(gymIdOf(s)));
  return {m,todayWd,doneIds,skipped,missed,doneToday,legsYesterday};
}
function planWeek(now=new Date()){
  const st=weekState(now), o=dayOpts();
  const queue=[...PRIO.filter(id=>st.missed.includes(id)),...GYM_IDS.filter(id=>natWd(id)>=st.todayWd&&!st.doneIds.has(id)&&!st.skipped.has(id))];
  const plan={}; let prevLegs=st.legsYesterday;
  for(let wd=st.todayWd;wd<=5;wd++){
    const isToday=wd===st.todayWd;
    if(isToday&&st.doneToday){plan[wd]=st.doneToday;prevLegs=LEGS.has(st.doneToday);continue}
    const dDay=addDays(st.m,wd-1);
    if(compOn(dDay)){prevLegs=false;continue} /* día de competición: sin gimnasio */
    const busy=isToday?o.matchSoon===true:DAYS[wd-1].kinds.includes("padel");
    const preComp=isToday?effCompete():!!compOn(addDays(dDay,1));
    let pick=null;
    for(const id of queue){
      if(!st.missed.includes(id)&&natWd(id)>wd)continue;
      if(LEGS.has(id)&&(wd===4||busy||prevLegs||(preComp&&(id==="A"||wd!==5))))continue; /* la víspera de competir, solo la activación del viernes */
      pick=id;break;
    }
    if(pick){queue.splice(queue.indexOf(pick),1);plan[wd]=pick}
    prevLegs=!!pick&&LEGS.has(pick);
  }
  return {plan,dropped:queue,st};
}
const shortTitle=id=>DAYS.find(d=>d.id===id).title;
function rescheduleCard(){
  const now=new Date(), st=weekState(now);
  if(!st.missed.length)return "";
  const miss=st.missed.map(id=>`<b>${esc(shortTitle(id))}</b> (${dayName(natWd(id))})`).join(" y ");
  if(st.todayWd>5)return `<section class="card coach"><div class="eyebrow" style="color:var(--ball)">Tu semana</div><p style="margin:6px 0 0">Esta semana se quedó sin hacer ${miss}. No la recuperes el fin de semana: el lunes empieza otra y seguimos. No pasa nada.</p></section>`;
  if(st.doneToday)return "";
  const o=dayOpts();
  if(o.matchSoon===undefined)return `<section class="card coach" style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow" style="color:var(--ball)">Reorganizar tu semana</div>
    <p style="margin:0">Te quedó pendiente ${miss}. Te digo qué hacer hoy, pero antes:</p>
    <p style="margin:0;font-weight:700">¿Juegas hoy al pádel en las próximas 6 horas?</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="ghostbtn small" data-act="match-yes">Sí, juego</button><button class="ghostbtn small" data-act="match-no">No</button></div></section>`;
  const {plan,dropped}=planWeek(now), cur=today().id, pick=plan[st.todayWd];
  const rows=[];for(let wd=st.todayWd;wd<=5;wd++)rows.push(`<div class="row" style="padding:6px 0"><span style="font-weight:600;text-transform:capitalize">${wd===st.todayWd?"Hoy":dayName(wd)}</span><span class="small" style="text-align:right">${plan[wd]?esc(shortTitle(plan[wd])):'<span class="muted">Sin gimnasio · movilidad o descanso</span>'}</span></div>`);
  const why=pick&&LEGS.has(pick)&&pick!==DAYS[st.todayWd-1].id?"Hoy puedes cargar pierna: la sesión de pierna es la que más velocidad te da.":(!pick||!LEGS.has(pick))&&st.missed.some(id=>LEGS.has(id))?(o.matchSoon?"Como juegas hoy, nada de pierna pesada: la dejamos para cuando llegues fresco.":"Hoy no toca pierna para no cargarla dos días seguidos o antes de tu entrenador."):"";
  return `<section class="card coach" style="display:flex;flex-direction:column;gap:8px"><div class="eyebrow" style="color:var(--ball)">Reorganizar tu semana</div>
    <p style="margin:0">Te quedó pendiente ${miss}. Así queda tu semana${o.matchSoon?" (hoy juegas)":""}:</p>
    <div>${rows.join("")}</div>
    ${dropped.length?`<p class="small muted" style="margin:0">Se queda fuera esta semana: ${dropped.map(id=>esc(shortTitle(id))).join(", ")}. No pasa nada: mejor una sesión menos que dos el mismo día.</p>`:""}
    ${why?`<p class="small" style="margin:0;color:var(--ball)">${why}</p>`:""}
    ${pick&&pick!==cur?`<button class="ballbtn" style="font-size:18px;padding:13px" data-act="plan-apply" data-id="${pick}">Hoy hago la ${pick}</button>`:!pick&&DAYS[st.todayWd-1].gym&&cur!=="X"?`<button class="ballbtn" style="font-size:18px;padding:13px" data-act="plan-apply" data-id="X">Hoy, solo movilidad</button>`:""}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" style="background:var(--surface2);color:var(--muted)" data-act="match-reset">Cambiar mi respuesta</button><button class="chip" style="background:var(--surface2);color:var(--muted)" data-act="skip-missed">No la voy a recuperar</button></div>
  </section>`;
}

  else if(cNext)N.push({i:"🏆",t:`${cNext.i===1?"Mañana":"El "+addDays(now,cNext.i).toLocaleDateString("es-ES",{weekday:"long"})} tienes ${cNext.c.name}. La app ya lo tiene en cuenta: nada de pierna pesada la víspera${addDays(now,cNext.i).getDay()===6?" y el viernes, activación":""}. Duerme bien esos días.`});

  if(lastS&&lastS.knee>=4&&now-new Date(lastS.start)<3*864e5)N.push({i:"🦵",t:`La rodilla marcó ${lastS.knee}/10 en la última sesión. Si hoy sigue molestando, nada de saltos ni frenadas; si dura más de una semana, que la vea tu fisio.`});
  if(todayS.some(s=>GYM_IDS.includes(gymIdOf(s))))N.push({i:"🧊",t:"Recuperación de hoy: después de la fuerza, nada de baño de agua fría en las siguientes horas (frena lo que acabas de ganar). Ducha normal; jacuzzi o sauna, sí, como mucho 10-15 minutos, bebiendo agua y con la glucosa controlada."});

  if(S.sessions.length>=3&&(!S.lastBackup||now-new Date(S.lastBackup)>14*864e5))N.push({i:"💾",t:"Hace tiempo que no guardas una copia de tus registros. Progreso → Copia de seguridad → Guardar copia.",act:"go-progreso"});
  if(!N.length)return "";
  return `<section class="card" style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow">Avisos de tu entrenador</div>
   ${N.map(n=>`<div style="display:flex;gap:10px;align-items:flex-start"><span aria-hidden="true" style="font-size:18px;line-height:1.3">${n.i}</span><div class="small" style="color:var(--text);flex:1">${esc(n.t)}${n.act?` <button class="chip" style="background:var(--surface2);color:var(--court);padding:2px 10px;margin-left:4px" data-act="${n.act}">Ir</button>`:""}</div></div>`).join("")}

}

/* Carga de los últimos 7 días frente a la media semanal de las 4 semanas anteriores (agudo:crónico) */
function loadBetween(a,b){return S.sessions.filter(s=>s.status!=="en curso"&&new Date(s.start)>=a&&new Date(s.start)<b).reduce((x,s)=>x+s.rpe*s.minutes,0)
  +realWorkouts().filter(w=>new Date(w.start)>=a&&new Date(w.start)<b).reduce((x,w)=>x+w.minutes*(w.padel?(w.rpe||6):w.type==="Caminar"?2:4),0)}
function acwr(){
  const now=new Date(), a=loadBetween(addDays(now,-7),now), c=loadBetween(addDays(now,-35),addDays(now,-7))/4;
  const first=Math.min(...[...S.sessions.map(s=>+new Date(s.start)),...S.health.workouts.map(w=>+new Date(w.start))].filter(isFinite));
  if(!(c>0)||!isFinite(first)||now-first<21*864e5)return null;
  return {a:Math.round(a),c:Math.round(c),r:a/c};
}

  const el=$("#elapsed"); if(el)el.textContent=mmss((Date.now()-P.start)/1000);
  if(P.restEnd){
    const left=(P.restEnd-Date.now())/1000;
    const o=$("#rest-out"), c=$("#rest-ring");
    if(o)o.textContent=mmss(left);
    if(c)c.style.strokeDashoffset=String(691*(1-Math.max(0,left)/P.restTotal));
    if(left<=0){P.restEnd=0;vibrate([200,100,200]);beep();const r=$("#rest");if(r)r.remove()}
  }
}
function completeSet(){
  const st=P.steps[P.i];
  const rec={ex:st.e.id,set:st.set,sid:P.sid,t:new Date().toISOString()};
  if(st.e.defaults.RIR!=null)rec.tRIR=st.e.defaults.RIR;
  st.e.metrics.forEach(m=>rec[m]=P.vals[m]);
  S.sets.push(rec); save(); vibrate(40);
  const pr=checkPR(rec); if(pr){(P.prs=P.prs||[]).push({name:st.e.name,txt:pr});prBanner(st.e.name,pr)}
  if(P.i>=P.steps.length-1){openFinish(false);return}
  const rest=st.e.rest; P.i++; P.vals=prefill(P.steps[P.i]); drawPlayer();
  if(rest>0)showRest(rest);
}
function showRest(sec){
  P.restTotal=sec; P.restEnd=Date.now()+sec*1000;
  const nx=P.steps[P.i];
  const el=document.createElement("div"); el.className="rest"; el.id="rest"; el.setAttribute("role","timer");
  el.innerHTML=`<span class="eyebrow" style="color:var(--court)">Descanso</span>
   <div class="ring"><svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="110" fill="none" stroke="#1a243a" stroke-width="14"/><circle id="rest-ring" cx="120" cy="120" r="110" fill="none" stroke="#3f7df4" stroke-width="14" stroke-linecap="round" stroke-dasharray="691" stroke-dashoffset="0"/></svg><output id="rest-out">${mmss(sec)}</output></div>
   <div style="text-align:center"><div class="small muted">Ahora</div><div style="font:800 28px var(--display)">${esc(nx.e.name)}</div><div class="small muted">Serie ${nx.set+1} de ${nx.e.sets}</div></div>

  $("#layer").appendChild(el); tick();
}

/* ============ RÉCORDS PERSONALES ============ */
const e1rm=x=>x.kg>0&&x.reps>0?x.kg*(1+Math.min(x.reps,12)/30):0;
function checkPR(rec){
  if(!(rec.kg>0))return null;
  const prev=S.sets.filter(x=>x.ex===rec.ex&&x.sid!==rec.sid&&x.kg>0);
  if(!prev.length)return null; /* la primera vez no cuenta: no hay con qué comparar */
  const same=S.sets.filter(x=>x.ex===rec.ex&&x.sid===rec.sid&&x!==rec&&x.kg>0), all=[...prev,...same];
  const bestKg=Math.max(...all.map(x=>x.kg)), bestE=Math.max(...all.map(e1rm));
  if(rec.kg>bestKg)return `${fmtNum(rec.kg)} kg: el mayor peso que has movido aquí`;
  if(rec.reps&&e1rm(rec)>bestE+0.01)return `${fmtNum(rec.kg)} kg × ${rec.reps}: tu mejor serie`;
  return null;
}
function prBanner(name,txt){
  document.querySelector(".pr-banner")?.remove();
  const el=document.createElement("div");el.className="pr-banner";el.setAttribute("role","status");
  el.innerHTML=`<span style="font-size:26px">🏆</span><div>Récord personal<small>${esc(name)} · ${esc(txt)}</small></div>`;
  document.body.appendChild(el);vibrate([60,40,60,40,140]);try{ping();setTimeout(ping,180)}catch(e){}
  setTimeout(()=>el.remove(),3600);
}

  const kgMoved=Math.round(sets.reduce((a,x)=>{const e=exById(x.ex);if(!x.reps)return a;return a+((x.kg||0)+(e&&e.barbell?20:0))*x.reps},0));
  const m=monday(), wk=S.sessions.filter(x=>x.status!=="en curso"&&new Date(x.start)>=m&&GYM_IDS.includes(gymIdOf(x))).length;
  return {title:s.title,date:new Date(s.start),minutes:s.minutes,rpe:s.rpe,load:s.rpe*s.minutes,sets:sets.length,
    exercises:new Set(sets.map(x=>x.ex)).size,kgMoved,prs:Object.values(Object.fromEntries(((P&&P.prs)||[]).map(p=>[p.name,p]))),partial:s.status==="parcial",gBefore:s.gBefore,gAfter:s.gAfter,week:wk};
}

  const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/ms),v=Math.round(to*(1-Math.pow(1-k,3)));el.textContent=v.toLocaleString("es-ES");if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function confetti(n=150){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c);
  const dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  const cols=["#d9ea4c","#3f7df4","#52cf90","#ffffff","#f5a844"];
  const P2=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.28,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)],ball:Math.random()<.12}));
  const t0=performance.now();
  const f=t=>{x.clearRect(0,0,W,H);P2.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;
      if(p.ball){x.beginPath();x.arc(0,0,p.r*.9,0,7);x.fill();x.strokeStyle="#fff";x.lineWidth=1.2;x.beginPath();x.arc(-p.r*.9,0,p.r*.9,-.9,.9);x.stroke()}else x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});

}

/* Formato del atajo (una línea por dato): W|tipo|inicio|fin · P|peso|fecha · G|grasa|fecha · L|glucosa|fecha */
function parseShortcutLines(raw){
  const d={workouts:[],body:[],glucose:[]},bodyBy={};
  const num=v=>{const m=String(v||"").replace(",",".").match(/-?\d+(\.\d+)?/);return m?+m[0]:null};
  const iso=v=>{const t=new Date(String(v||"").trim());return isNaN(t)?null:t.toISOString()};
  String(raw).split(/\r?\n/).forEach(l=>{const c=l.split("|").map(x=>x.trim());const k=c[0];
    if(k==="W"&&c.length>=4){const st=iso(c[2]),en=iso(c[3]);if(st&&en)d.workouts.push({type:c[1]||"Entrenamiento",start:st,end:en})}
    else if((k==="P"||k==="G")&&c.length>=3){const t=iso(c[2]),v=num(c[1]);if(!t||v==null)return;const key=t.slice(0,16);const b=bodyBy[key]=bodyBy[key]||{t};

/* ============ GLUCOSA Y DEPORTE ============
   Glucosa: CSV de LibreView (la web de Abbott que conecta con LibreLink) o el atajo de Salud.
   Actividades: sesiones de esta app + pádel (Apple Watch o apuntado a mano). */
function parseLibreView(txt){
  const lines=txt.replace(/^﻿/,"").split(/\r?\n/);
  const split=l=>l.split(/[,;\t](?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>c.replace(/^"|"$/g,"").trim());
  let hi=lines.findIndex(l=>/(timestamp|sello de tiempo|marca de tiempo|fecha y hora)/i.test(l)&&/(gluc)/i.test(l));
  if(hi<0)return {err:"No reconozco el archivo. Descárgalo en libreview.com → Descargar datos de glucosa."};
  const H=split(lines[hi]).map(h=>h.toLowerCase());
  const iT=H.findIndex(h=>/(timestamp|sello de tiempo|marca de tiempo|fecha y hora)/.test(h));
  const iHist=H.findIndex(h=>/(historic|historial|histórico).*gluc|gluc.*(historic|historial|histórico)/.test(h));
  const iScan=H.findIndex(h=>/(scan|escaneo|lectura).*gluc|gluc.*(scan|escaneo)/.test(h));
  const mmol=[H[iHist],H[iScan]].some(h=>h&&/mmol/.test(h)), english=/device timestamp/i.test(lines[hi]);
  if(iT<0||(iHist<0&&iScan<0))return {err:"El archivo no tiene columnas de glucosa."};
  const out=[];
  for(const l of lines.slice(hi+1)){ if(!l.trim())continue; const c=split(l);
    const raw=(iHist>=0&&c[iHist])||(iScan>=0&&c[iScan])||""; let v=parseFloat(raw.replace(",","."));
    if(!isFinite(v)||v<=0)continue; if(mmol)v=Math.round(v*18);
    const m=(c[iT]||"").match(/^(\d{1,4})[-/.](\d{1,2})[-/.](\d{1,4})[ T]+(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm|a\. ?m\.|p\. ?m\.)?/i); if(!m)continue;
    let [_,a,b,cc,hh,mm,ap]=m; let y,mo,d;
    if(a.length===4){y=+a;mo=+b;d=+cc}else{y=+cc;if(+a>12){d=+a;mo=+b}else if(+b>12){mo=+a;d=+b}else if(english){mo=+a;d=+b}else{d=+a;mo=+b}}
    let h=+hh; if(ap){const pm=/p/i.test(ap); if(pm&&h<12)h+=12; if(!pm&&h===12)h=0}
    const dt=new Date(y,mo-1,d,h,+mm); if(isNaN(dt))continue; out.push({t:dt.toISOString(),v});
  }
  return out.length?{list:out}:{err:"No encontré lecturas de glucosa en el archivo."};
}
function importLibreView(txt){
  const r=parseLibreView(txt); if(r.err)return r.err;
  const gk=t=>new Date(t).toISOString().slice(0,16);
  const seen=new Set(S.health.glucose.map(g=>gk(g.t))); let n=0;
  r.list.forEach(g=>{const k=gk(g.t);if(!seen.has(k)){S.health.glucose.push(g);seen.add(k);n++}});
  S.health.glucose.sort((a,b)=>new Date(a.t)-new Date(b.t)); S.health.glucose=S.health.glucose.slice(-20000); GC=null; save();
  const a=new Date(r.list[0].t),b=new Date(r.list.at(-1).t),f=d=>d.toLocaleDateString("es-ES",{day:"numeric",month:"short"});
  return `Glucosa importada: ${n} lecturas nuevas (${f(a<b?a:b)} – ${f(a<b?b:a)})`;
}
/* Búsqueda rápida en la serie de glucosa */
let GC=null;
function gArr(){if(!GC||GC.n!==S.health.glucose.length){const a=S.health.glucose.map(g=>({ms:+new Date(g.t),v:+g.v})).filter(g=>isFinite(g.ms)&&isFinite(g.v)).sort((x,y)=>x.ms-y.ms);GC={n:S.health.glucose.length,a}}return GC.a}
function gIdx(a,ms){let lo=0,hi=a.length;while(lo<hi){const m=(lo+hi)>>1;if(a[m].ms<ms)lo=m+1;else hi=m}return lo}
function gAt(ms,tol=20*6e4){const a=gArr();if(!a.length)return null;const i=gIdx(a,ms),p=a[i-1],n=a[i];
  if(p&&n&&n.ms-p.ms<=35*6e4)return p.v+(n.v-p.v)*(ms-p.ms)/(n.ms-p.ms);
  const best=[p,n].filter(Boolean).sort((x,y)=>Math.abs(x.ms-ms)-Math.abs(y.ms-ms))[0];return best&&Math.abs(best.ms-ms)<=tol?best.v:null}

const gMin=(a,b)=>{const r=gRange(a,b);return r.length?r.reduce((m,x)=>x.v<m.v?x:m):null};
const gMax=(a,b)=>{const r=gRange(a,b);return r.length?r.reduce((m,x)=>x.v>m.v?x:m):null};

    L.push({cat,start:+new Date(s.start),min:s.minutes,gB:s.gBefore,gA:s.gAfter,rpe:s.rpe,label:s.title})});

     Sin apuntar: el «Tenis» del jueves por la tarde es el entreno con tu entrenador; el resto, partido. */
  const manual=S.health.workouts.filter(w=>w.padel&&w.src==="manual").map(w=>+new Date(w.start));

  if(e.target.id==="imp-txt")$("#imp-err").textContent="";
  if(e.target.id==="restore"&&e.target.files[0])restore(e.target.files[0]);
  if(e.target.id==="libreview"&&e.target.files[0]){const f=e.target.files[0];const r=new FileReader();r.onload=()=>{toast(importLibreView(String(r.result)));render()};r.readAsText(f);e.target.value=""}
  if(e.target.id==="renpho"&&e.target.files[0]){const f=e.target.files[0];const r=new FileReader();r.onload=()=>{const m=importRenpho(String(r.result));toast(m);render()};r.readAsText(f);e.target.value=""}
  if(e.target.id==="f-knee"){$("#f-knee-v").textContent=e.target.value;$("#f-knee-v").style.color=+e.target.value>=4?"var(--warn)":""}
});
function openExit(){
  const el=document.createElement("div"); el.className="sheet"; el.id="exit";
  el.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-label="Terminar la sesión"><h2 class="title" style="font-size:28px">¿Terminar la sesión?</h2>
   <button class="ballbtn" style="font-size:18px" data-act="exit-partial">Guardar como sesión parcial</button>
   <button class="ghostbtn" style="color:var(--heart)" data-act="exit-discard">Descartar sesión</button>
   <button class="ghostbtn" data-act="exit-cancel">Seguir entrenando</button></div>`;
  $("#layer").appendChild(el);
}

/* Importación directa desde el atajo: plan-padel/#importar=<datos> (el fragmento no sale del móvil) */
(function(){const h=location.hash;if(h.startsWith("#importar=")){try{const err=importHealth(decodeURIComponent(h.slice(10)));if(err)toast(err)}catch(e){}history.replaceState(null,"",location.pathname)}})();
/* Sin conexión (solo cuando está publicada como web) */
if("serviceWorker" in navigator&&location.protocol==="https:"&&!location.hostname.endsWith("claude.ai")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
try{if(S.body&&S.body.length){const n=S.body.length;normalizeBody();if(S.body.length!==n)save()}}catch(e){}
render();
if(S.seenVersion!==APP_VERSION)setTimeout(()=>{if(!$("#layer").children.length)openWhatsNew()},600);
</script>
</body>
