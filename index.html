<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Plan Pádel">
<meta name="theme-color" content="#080e1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* "Pista de noche": tema oscuro único y deliberado. Azul césped = información; amarillo pelota = lo que se toca.
   Layout: app de una columna (máx. 520px), pestañas fijas abajo, modo sesión a pantalla completa por encima. */
:root{
  --ink:#080e1a; --surface:#111929; --surface2:#1a243a; --line:rgba(255,255,255,.07);
  --court:#3f7df4; --ball:#d9ea4c; --ballInk:#1a220a; --text:#ecf0f7; --muted:#92a0bb;
  --ok:#52cf90; --warn:#f5a844; --heart:#fa6672;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",-apple-system,system-ui,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--text)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ball);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:12px calc(100px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big{font:800 46px/1 var(--display);letter-spacing:.005em;margin:2px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.ballbtn{width:100%;padding:17px;border-radius:18px;background:var(--ball);color:var(--ballInk);font:800 22px var(--display);letter-spacing:.04em;text-transform:uppercase;transition:transform .15s}
.ballbtn:active{transform:scale(.97)}
.ghostbtn{padding:14px;border-radius:16px;background:var(--surface2);font-weight:600;width:100%}
.title{font:800 34px/1.02 var(--display);margin:0;text-wrap:balance}
.h3{font:800 20px var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}

/* Fase ATR */
.atr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.atr div{background:var(--surface);border-radius:14px;padding:10px 12px;color:var(--muted);font-size:11px;font-weight:500}
.atr b{display:block;font:800 26px/1 var(--display)}
.atr .on{background:var(--court);color:var(--ink)}
.weeks{display:flex;align-items:center;gap:8px;margin-top:10px}
.weeks i{flex:1;height:4px;border-radius:4px;background:var(--surface2)}
.weeks i.on{background:var(--court)}

/* Salud */
.health{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric b{font:700 22px var(--body);font-variant-numeric:tabular-nums}
.metric small{font-size:10px;font-weight:600;color:var(--muted);margin-left:2px}
.metric div{font-size:11px;font-weight:500;margin-top:1px}

/* Bloques */
.ex-row{display:grid;grid-template-columns:8px 1fr 32px;gap:12px;align-items:start;padding:6px 0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--court);margin-top:8px}
.play{width:32px;height:32px;border-radius:50%;background:var(--ball);color:var(--ballInk);display:grid;place-items:center;text-decoration:none}
.play svg{width:12px;height:12px}
.last{font-size:12px;color:var(--ball);opacity:.85}

/* Semana */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;margin-top:6px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;gap:2px}
.bar i{display:block;border-radius:5px}
.bar span{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.day{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:12px;border-radius:16px;align-items:start}
.day.today{background:rgba(26,36,58,.7)}
.day .d{text-align:center}
.day .d small{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.day .d b{font:700 24px var(--body);font-variant-numeric:tabular-nums}

/* Progreso */
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.hscroll::-webkit-scrollbar{display:none}
.best{display:flex;align-items:baseline;gap:6px}
.best b{font:700 48px var(--body);font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}

/* Pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(17,25,41,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--ball)}

/* Pantallas superpuestas */
.overlay{position:fixed;inset:0;z-index:40;background:var(--ink);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up .3s ease}
.overlay .inner{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:16px;height:16px}
.topbar{display:flex;align-items:center;justify-content:space-between}
.prog{display:flex;gap:3px;margin-top:14px}
.prog i{flex:1;height:5px;border-radius:5px;background:var(--surface2)}
.prog i.done{background:var(--court)}
.prog i.now{background:var(--ball)}
.scroll{flex:1;overflow-y:auto;min-height:0;padding:18px 0 8px;scrollbar-width:none}
.exname{font:800 42px/1 var(--display);margin:6px 0 8px;text-wrap:balance}
.vid{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--ball);color:var(--ballInk);font-weight:600;font-size:14px;text-decoration:none}
.vid svg{width:12px;height:12px}
.stepper{display:grid;grid-template-columns:76px 1fr 50px auto 50px;align-items:center;gap:10px;padding:6px 0}
.stepper .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stepper .lab small{display:block;font-size:10px;font-weight:500;letter-spacing:0;text-transform:none}
.stepper button{width:50px;height:50px;border-radius:14px;background:var(--surface2);font-size:24px;font-weight:600}
.stepper button:active{background:#25324e}
.stepper output{font:700 40px var(--body);font-variant-numeric:tabular-nums;min-width:92px;text-align:center}
.rest{position:fixed;inset:0;z-index:50;background:rgba(8,14,26,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ring{position:relative;width:240px;height:240px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring output{position:absolute;inset:0;display:grid;place-items:center;font:700 64px var(--body);font-variant-numeric:tabular-nums}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet .panel{background:var(--surface);width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;border-radius:26px 26px 0 0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;animation:up .3s ease}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe button{padding:12px 0;border-radius:12px;background:var(--surface2);font:700 22px var(--body)}
.rpe button[aria-pressed="true"]{background:var(--court);color:var(--ink)}
.field{background:var(--surface2);border-radius:16px;padding:12px 14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field textarea{width:100%;background:none;border:0;outline:0;padding:2px 0}
.field input{font:700 28px var(--body);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--surface2);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;animation:up .25s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ============ PLAN · BLOQUE 1 (4 semanas desde el lunes 23-11-2026) ============
   Hecho a partir de tus registros reales con Marcfit, solo con el material de tu gimnasio
   (cardio: cinta, elíptica y bici estática) y con la rodilla derecha en mente.
   Semana 1: aprendes los pesos (RIR +1) · Semana 2: la que está escrita · Semana 3: la más dura (RIR −1)
   Semana 4: descarga (una serie menos y RIR +2). */
const PHASES=[{k:"A",n:"Acumulación",g:"Base: fuerza en tus ejercicios ancla, rodilla y aeróbico"},{k:"T",n:"Transformación",g:"Convertir la base en potencia y velocidad"},{k:"R",n:"Realización",g:"Intensidad de partido, menos volumen"}];
const BLOCK_START=new Date(2026,10,23);
const WEEK_INFO={1:{t:"Semana 1 · aprendes los pesos",rir:1,sets:0},2:{t:"Semana 2 · carga normal",rir:0,sets:0},3:{t:"Semana 3 · la más exigente",rir:-1,sets:0},4:{t:"Semana 4 · descarga",rir:2,sets:-1}};
function blockWeek(d=new Date()){const days=Math.floor((monday(d)-monday(BLOCK_START))/86400000);return Math.min(4,Math.max(1,Math.floor(days/7)+1))}
const BLOCK={phase:"A",get week(){return blockWeek()},weeks:4};

/* presc admite {S} (series de esa semana) y {R} (RIR de esa semana) */
const ex=(id,name,presc,cue,video,sets,metrics,defaults,rest,barbell=false,opt={})=>({id,name,presc,cue,video,sets,metrics,defaults,rest,barbell,...opt});
const WARMUP=[
 {id:"cal",title:"Calentamiento competitivo · 8 min",note:"Antes de pelotear",ex:[
  ex("cal-movil","Movilidad dinámica","Cadera, tobillo y hombro · 2 min","Todo en movimiento, nada de estiramientos quietos.","padel dynamic warm up",1,["seg"],{seg:120},0),
  ex("cal-activ","Activación","10 sentadillas + 10 zancadas + 10 W con goma","Ritmo vivo.","dynamic warm up squat lunge",1,["reps"],{reps:30},0),
  ex("cal-chispa","Chispa","3 salidas laterales + 3 saltos + 3 frenadas por lado","Cada vez más rápido. Termina con pulsaciones altas.","padel warm up footwork",1,["reps"],{reps:9},0)]},
 {id:"post",title:"Después del partido · 10 min",note:"Nada más salir de la pista",ex:[

  ex("post-rodillo","Rodillo","Gemelos, cuádriceps y glúteo · 5 min","Sin buscar dolor.","foam roll after match",1,["seg"],{seg:300},0)]}];

const SESSION_A={id:"A",wd:1,title:"A · Pierna: fuerza y rodilla",sub:"La sesión más pesada de la semana. Si hoy juegas, que sea a las 20:00, nunca a mediodía.",kinds:["gym"],gym:55,padel:0,rpe:[7,8],warn:"Pierna pesada y saltos: mide la glucosa antes de empezar.",blocks:[
 {id:"a0",title:"Calentamiento",note:"1 vuelta · 8 min",ex:[
  ex("a-bici","Bici estática","2 min suave","Pedalea fácil, que puedas hablar.","stationary bike warm up",1,["seg"],{seg:120},0),
  ex("a-tobillo","Movilidad de tobillo con goma","10 por pierna","Rodilla hacia delante sin levantar el talón.","ankle mobility band knee to wall",1,["reps"],{reps:10},0),

  ex("a-monster","Paso lateral con goma (monster walk)","10 pasos por lado","Goma por encima de las rodillas. Las rodillas empujan hacia fuera: así se activa el glúteo medio, que sujeta tu rótula.","monster walk band glute medius",1,["reps"],{reps:10},0)]},
 {id:"a0b",title:"Primer paso y rampa",note:"Superserie · 3 rondas · con las piernas frescas",ex:[
  ex("lateral-sprint","Salida desde la posición de espera","{S} × 3 salidas de 3-5 m: al frente, lateral y en diagonal hacia atrás","Como en la red: split-step y primer paso explosivo. Cada salida al 100 % y vuelves andando. Así se gana el 80 % de los desplazamientos del pádel, que son de 1-2 m.","lateral shuffle to sprint drill",3,["reps"],{reps:3},15),
  ex("sprint-rampa","Sprint en rampa","{S} × 1 de 8-10 m cuesta arriba","Cuerpo inclinado, empuja el suelo hacia atrás con pasos potentes. Vuelve andando despacio.","hill sprint acceleration",3,["reps"],{reps:1},45)]},
 {id:"a1",title:"Fuerza + salto",note:"Contraste · 4 rondas",ex:[

  ex("a-cajon","Salto al cajón","{S} × 3 · máxima altura","Cae suave sobre el cajón, rodillas hacia fuera. Baja andando, no saltando.","box jump landing technique",4,["reps"],{reps:3},120)]},
 {id:"a2",title:"Cadena posterior",note:"Superserie · 3 rondas",ex:[

 {id:"a3",title:"Rodilla a prueba de pádel",note:"Superserie · 3 rondas",ex:[

const SESSION_B={id:"B",wd:2,title:"B · Empuje, lanzamientos y pecho",sub:"Tren superior: llegas con las piernas frescas al partido de mediodía.",kinds:["gym","padel"],gym:50,padel:90,rpe:[7,8],warn:null,blocks:[

 {id:"b2",title:"Press",note:"Superserie · 3 rondas",ex:[
  ex("press-db","Press de banca con 2 mancuernas","{S} × 8 · RIR {R}","Baja controlado y sube rápido.","dumbbell bench press technique",3,["kg","reps","RIR"],{kg:22.5,reps:8,RIR:3},20),
  ex("flex-plio","Flexiones pliométricas","{S} × 4","Despega las manos y cae con los codos blandos. Si no salen limpias, desde las rodillas.","plyometric push up",3,["reps"],{reps:4},90)]},
 {id:"b3",title:"Hombro y antirrotación",note:"Superserie · 3 rondas",ex:[
  ex("landmine-press","Landmine press a una mano","{S} × 6 por brazo · RIR {R}","Medio arrodillado. Que no te gire el tronco.","half kneeling landmine press",3,["kg","reps","RIR"],{kg:10,reps:6,RIR:3},15),
  ex("pallof","Press Pallof","{S} × 10 por lado","Empuja al frente y aguanta: la polea no te gira.","pallof press",3,["kg","reps"],{kg:5,reps:10},45)]},
 {id:"b4",title:"Pecho y tríceps",note:"Superserie · 3 rondas · la última, serie descendente",ex:[
  ex("cruce-poleas","Cruce de poleas (aperturas)","{S} × 12 · en la última ronda, al acabar baja el peso y sigue hasta casi el fallo","Un pie adelantado, codos un poco flexionados y junta las manos delante del pecho apretando 1\". Sin dolor en el hombro.","cable chest fly",3,["kg","reps"],{kg:10,reps:12},10),
  ex("triceps-polea","Extensión de tríceps en polea con cuerda","{S} × 12 · en la última ronda, serie descendente","Codos pegados al cuerpo y quietos. Abre la cuerda abajo y sube controlado.","tricep rope pushdown",3,["kg","reps"],{kg:15,reps:12},40)]}]};

const RECOVERY={id:"X",wd:3,title:"Movilidad y rodillo",sub:"Opcional, 20 minutos. Hoy toca llegar fresco al entreno del jueves.",kinds:["suave","padel"],gym:20,padel:90,rpe:[2,3],warn:null,blocks:[
 {id:"x1",title:"Rodillo",note:"30\" por zona",ex:[
  ex("rod-gemelo","Rodillo: gemelos y sóleo","30\" por pierna","Lento. Para 5\" en los puntos cargados.","foam roll calves",1,["seg"],{seg:30},0),
  ex("rod-cuad","Rodillo: cuádriceps y aductor","30\" por pierna","Sin prisa, respirando.","foam roll quads adductors",1,["seg"],{seg:30},0),

/* Ajusta una sesión a la semana del bloque, a la versión corta y al «compito mañana» */
function materialize(day,date=new Date(),opts={}){
  const w=blockWeek(date), W=WEEK_INFO[w];
  let base=day;
  if(day.id==="D"&&opts.compete)base=ACTIVATION;
  let blocks=base.blocks.map(b=>({...b,ex:b.ex.map(e=>{
    const multi=e.sets>1;
    const sets=multi?Math.max(1,e.sets+W.sets):e.sets;
    const d={...e.defaults};
    if(d.RIR!=null)d.RIR=Math.max(e.rirMin??0,d.RIR+W.rir);
    const presc=e.presc.replace("{S}",sets).replace("{R}",d.RIR??"");
    return {...e,sets,defaults:d,presc};
  })}));
  if(opts.short){
    blocks=blocks.filter((b,i)=>i===0||b.id.endsWith("1")||b.id.endsWith("2")).map(b=>({...b,ex:b.ex.map(e=>({...e,sets:Math.min(e.sets,2),presc:e.presc.replace(/^\d+ ×/,Math.min(e.sets,2)+" ×")}))}));
  }
  return {...base,blocks,week:w,weekText:W.t,short:!!opts.short};
}
/* Duración estimada: trabajo de cada serie + descansos + 20" por cambio de ejercicio + 2' por bloque */
function estimateMinutes(day){
  let s=0;
  day.blocks.forEach(b=>{s+=120;b.ex.forEach(e=>{
    const work=e.defaults.seg?e.defaults.seg:(e.defaults.reps||5)*4;
    s+=e.sets*(work+20+e.rest);
  })});
  return Math.round(s/60);
}

function weekLoad(){
  const m=monday();
  return S.sessions.filter(s=>s.status!=="en curso"&&new Date(s.start)>=m).reduce((a,s)=>a+s.rpe*s.minutes,0)
       + S.health.workouts.filter(w=>new Date(w.start)>=m).reduce((a,w)=>a+w.minutes*(w.padel?6:w.type==="Caminar"?2:4),0);
}

/* Tu cuerpo: báscula (Renpho → Salud → atajo, o a mano). Lo que cuenta es la tendencia. */
const BODYM=[{id:"kg",n:"Peso",u:"kg",step:.1},{id:"fat",n:"Grasa",u:"%",step:.1},{id:"skm",n:"Músculo esquelético",short:"Músculo",u:"kg",step:.1}];
let bodySel="fat";
function bodyAvg(arr,key,from,to){const v=arr.filter(b=>b[key]!=null&&+new Date(b.d)>=from&&+new Date(b.d)<to).map(b=>b[key]);return v.length?v.reduce((a,x)=>a+x,0)/v.length:null}
function bodyCard(){
  const B=(S.body||[]).slice().sort((a,b)=>new Date(a.d)-new Date(b.d));
  const M=BODYM.find(m=>m.id===bodySel), pts=B.filter(b=>b[bodySel]!=null).map(b=>({d:new Date(b.d),v:b[bodySel]}));
  const both=B.filter(b=>b.kg!=null&&b.fat!=null), last=both.at(-1)||B.at(-1), first=both[0]||B[0];
  const fatKg=b=>b&&b.kg!=null&&b.fat!=null?b.kg*b.fat/100:null, leanKg=b=>b&&b.kg!=null&&b.fat!=null?b.kg-fatKg(b):null;
  /* Ritmo: media de los últimos 7 días frente a la de 14-21 días antes */
  const now=Date.now(), D=864e5;
  const wNow=bodyAvg(B,"kg",now-7*D,now+D), wPrev=bodyAvg(B,"kg",now-21*D,now-14*D);
  const perWeek=wNow!=null&&wPrev!=null?(wNow-wPrev)/2:null;
  let advice="Pésate por la mañana, en ayunas, después del baño y antes de beber, 2-3 veces por semana. Un día suelto no dice nada: miramos la media semanal.";
  if(perWeek!=null){const pct=perWeek/wNow*100;
    advice=pct<-0.75?`Bajas ${fmtNum(-perWeek)} kg por semana: demasiado rápido. Así pierdes músculo y chispa en pista. Come algo más y coméntalo con tu endocrino (cambia la insulina).`
     :pct<-0.2?`Bajas ${fmtNum(-perWeek)} kg por semana: el ritmo bueno para perder grasa sin perder músculo ni velocidad.`
     :pct>0.3?`Subes ${fmtNum(perWeek)} kg por semana. Si la grasa también sube, revisa las comidas con tu endocrino o tu nutricionista.`
     :"Peso estable. Si la grasa baja y el músculo se mantiene, vas bien aunque la báscula no se mueva."}
  const muscleDrop=(()=>{const h=B.filter(b=>b.skm!=null);return h.length>1&&h.at(-1).skm-h[0].skm<=-1})();
  const has=k=>B.filter(b=>b[k]!=null);
  const delta=k=>{const h=has(k);return h.length>1?h.at(-1)[k]-h[0][k]:null};
  const tile=(m,good)=>{const v=has(m.id).at(-1)?.[m.id],dl=delta(m.id);return `<div style="background:var(--surface2);border-radius:14px;padding:10px 8px;text-align:center;min-width:0"><div class="num" style="font-size:22px;font-weight:800">${v!=null?fmtNum(Math.round(v*10)/10):"—"}<span class="small muted" style="font-weight:600"> ${m.u}</span></div><div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.short||m.n}</div>${dl!=null?`<div class="small" style="color:${good==="none"||dl===0?"var(--muted)":(dl<0)===(good==="down")?"var(--ok)":"var(--warn)"}">${dl>0?"▲ +":dl<0?"▼ ":"= "}${fmtNum(Math.round(Math.abs(dl)*10)/10)}</div>`:""}</div>`};
  return `<section class="card" style="display:flex;flex-direction:column;gap:12px">
   <div><div class="eyebrow" style="margin-bottom:4px">Tu cuerpo</div>
    <p class="small muted" style="margin:0">Para marcar abdominales, pecho y brazos lo que cuenta es que <b>baje la grasa y no baje el músculo</b>, no el peso. La báscula puede fallar 2-3 puntos de grasa (agua, glucosa): fíate de la tendencia.</p></div>
   ${last?`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${tile(BODYM[0],"none")}${tile(BODYM[1],"down")}${tile(BODYM[2],"up")}</div>
    ${fatKg(last)!=null?`<div class="small muted">Grasa: <b style="color:var(--text)">${fmtNum(Math.round(fatKg(last)*10)/10)} kg</b> · Todo lo demás (masa magra): <b style="color:var(--text)">${fmtNum(Math.round(leanKg(last)*10)/10)} kg</b>${first!==last&&fatKg(first)!=null?` · desde el ${new Date(first.d).toLocaleDateString("es-ES",{day:"numeric",month:"short"})}: grasa ${fatKg(last)-fatKg(first)<=0?"▼":"▲"} ${fmtNum(Math.round(Math.abs(fatKg(last)-fatKg(first))*10)/10)} kg, magra ${leanKg(last)-leanKg(first)>=0?"▲":"▼"} ${fmtNum(Math.round(Math.abs(leanKg(last)-leanKg(first))*10)/10)} kg`:""}</div>`:""}
    <div class="hscroll">${BODYM.map(m=>`<button class="chip" data-body="${m.id}" style="${m.id===bodySel?"background:var(--ball);color:var(--ballInk)":"background:var(--surface2);color:var(--muted)"}">${m.n}</button>`).join("")}</div>
    ${pts.length?lineChart(pts):`<p class="small muted" style="margin:0">Sin datos de ${M.n.toLowerCase()} todavía.</p>`}
    <div class="small" style="color:${muscleDrop?"var(--warn)":"var(--muted)"}">${muscleDrop?"El músculo esquelético ha bajado más de 1 kg: sube la proteína y no recortes más comida sin hablarlo con tu endocrino. ":""}${esc(advice)}</div>`
   :`<p class="small muted" style="margin:0">Apunta tu primera medida de la báscula Renpho. Cuando tengamos el atajo de Salud, llegará sola.</p>`}
   <div style="display:grid;grid-template-columns:repeat(3,1fr) auto;gap:6px;align-items:center">
    ${BODYM.map(m=>`<input id="b-${m.id}" inputmode="decimal" placeholder="${m.id==="skm"?"Músculo":m.id==="fat"?"Grasa %":"Peso"}" aria-label="${m.n} (${m.u})" style="min-width:0;background:var(--surface2);border:0;border-radius:10px;padding:8px;text-align:center">`).join("")}
    <button class="chip" style="background:var(--court);color:var(--ink)" data-act="body-save">Guardar</button></div>
  </section>`;
}
function addBody(list){S.body=S.body||[];const seen=new Set(S.body.map(b=>String(b.d).slice(0,16)));let n=0;
  list.forEach(b=>{const k=String(b.d).slice(0,16);if(!seen.has(k)){S.body.push(b);seen.add(k);n++}});S.body.sort((a,b)=>new Date(a.d)-new Date(b.d));S.body=S.body.slice(-400);return n}
/* Tus ejercicios registrados en esta app: último y mejor peso */
const EXNAME=(()=>{const m={};[...DAYS,ACTIVATION].forEach(d=>d.blocks.forEach(b=>b.ex.forEach(e=>{m[e.id]=e.name})));return m})();
function myLiftsCard(){
  const by={};S.sets.filter(s=>s.kg>0).forEach(s=>{(by[s.ex]=by[s.ex]||[]).push(s)});
  const rows=Object.entries(by).map(([id,arr])=>{const last=arr.at(-1),best=arr.reduce((a,s)=>s.kg>a.kg?s:a,arr[0]);
    const firstKg=arr[0].kg;return {id,name:EXNAME[id]||id,last,best,delta:last.kg-firstKg,n:new Set(arr.map(s=>s.sid)).size}})
    .sort((a,b)=>new Date(b.last.t)-new Date(a.last.t));
  return `<section class="card"><div class="eyebrow" style="margin-bottom:6px">Tus ejercicios en esta app</div>
   ${rows.length?rows.map(r=>`<div class="row"><div style="min-width:0"><div style="font-weight:600">${esc(r.name)}</div><div class="small muted">${r.n} ${r.n===1?"sesión":"sesiones"} · mejor ${fmtNum(r.best.kg)} kg × ${r.best.reps??"—"}</div></div><div class="num" style="text-align:right"><b style="font-size:20px">${fmtNum(r.last.kg)} kg</b><div class="small" style="color:${r.delta>0?"var(--ok)":r.delta<0?"var(--warn)":"var(--muted)"}">${r.delta>0?"▲ +"+fmtNum(r.delta):r.delta<0?"▼ "+fmtNum(r.delta):"="} desde el inicio</div></div></div>`).join(""):'<p class="small muted" style="margin:0">Cuando registres series con peso, aquí verás tu último peso, tu mejor marca y cuánto has subido en cada ejercicio.</p>'}
  </section>`;
}
async function backup(){

function lineChart(pts){

  const X=v=>P.l+(x1===x0?0.5:(v-x0)/(x1-x0))*(W-P.l-P.r), Y=v=>H-P.b-(v-yMin)/((yMax-yMin)||1)*(H-P.t-P.b);

  const ticks=[yMin,Math.round((yMin+yMax)/2),yMax];

   ${months.map(m=>`<text x="${X(+m<x0?x0:+m)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#92a0bb">${m.toLocaleDateString("es-ES",{month:"short"}).replace(".","")}</text>`).join("")}
   ${area?`<path d="${area}" fill="url(#ga)"/>`:""}

let P=null; /* estado del modo sesión */
function buildSteps(day){const st=[];day.blocks.forEach(b=>{const rounds=Math.max(...b.ex.map(e=>e.sets));for(let r=0;r<rounds;r++)b.ex.forEach(e=>{if(r<e.sets)st.push({b,e,set:r})})});return st}
/* Rellena la serie: dentro de la sesión, igual que la serie anterior; en una sesión nueva,
   el peso de la última vez ajustado por el RIR que apuntaste (progresión automática). */
function prefill(step){
  const e=step.e, mine=S.sets.filter(s=>s.ex===e.id), last=mine.at(-1);
  const v=Object.assign({},e.defaults); P&&(P.hint=null);
  if(!last)return v;
  e.metrics.forEach(m=>{if(last[m]!=null&&m!=="RIR")v[m]=last[m]});
  if(P&&last.sid===P.sid)return v;
  const target=e.defaults.RIR;
  if(e.metrics.includes("kg")&&target!=null){
    const prev=mine.filter(s=>s.sid===last.sid&&s.RIR!=null);
    if(prev.length){
      const minR=Math.min(...prev.map(s=>s.RIR)), avgR=prev.reduce((a,s)=>a+s.RIR,0)/prev.length;
      const step=e.barbell?2.5:(v.kg>=20?2.5:1.25);
      if(minR>=target+1&&avgR>=target+1.5){v.kg=Math.round((v.kg+step*2)/1.25)*1.25;P&&(P.hint={t:"up",txt:`Subo ${fmtNum(step*2)} kg: la última vez te sobraban repeticiones (RIR ${fmtNum(avgR)}).`})}
      else if(minR>=target+1){v.kg=Math.round((v.kg+step)/1.25)*1.25;P&&(P.hint={t:"up",txt:`Subo ${fmtNum(step)} kg: la última vez lo hiciste con RIR ${fmtNum(avgR)}.`})}
      else if(minR<target-1){v.kg=Math.max(0,Math.round((v.kg-step)/1.25)*1.25);P&&(P.hint={t:"down",txt:`Bajo ${fmtNum(step)} kg: la última vez llegaste muy justo (RIR ${minR}).`})}
      else P&&(P.hint={t:"same",txt:`Mismo peso que la última vez: el RIR fue el que tocaba.`});
    }
  }
  return v;
}

function importHealth(raw){

  const gl=(d.glucose||[]).map(x=>({t:x.t||x.date,v:+(x.v??x.value)})).filter(x=>x.t&&isFinite(x.v));
  const PADEL=/tenis|tennis|pickleball|p[aá]del|squash|raqueta/i;
  const wo=(d.workouts||[]).map(w=>{const type=String(w.type||w.name||"Entrenamiento");const start=w.start||w.startDate;const end=w.end||w.endDate;
    const minutes=Math.round(+(w.minutes??(end?(new Date(end)-new Date(start))/60000:0)));

    .map(b=>{if(b.fat!=null&&b.fat<1)b.fat=Math.round(b.fat*1000)/10;return b});
  if(!gl.length&&!wo.length&&!bd.length)return "No hay glucosa, entrenos ni datos de la báscula en esos datos.";

  const seenW=new Set(S.health.workouts.map(w=>w.id)); wo.forEach(w=>{if(!seenW.has(w.id))S.health.workouts.push(w)});

  const DIRS=[{a:"←",t:"Izquierda"},{a:"→",t:"Derecha"},{a:"↑",t:"Al frente"},{a:"↙",t:"Atrás izquierda"},{a:"↘",t:"Atrás derecha"}];
  const el=document.createElement("div"); el.id="react"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Modo reacción");
  el.style.cssText="position:fixed;inset:0;z-index:95;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center";
  el.innerHTML=`<div class="eyebrow">Modo reacción · ${n} salidas</div><div id="r-main" aria-live="assertive" style="font:800 34px var(--display);min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center">Posición de espera.<br>Empieza en 3"</div><div class="small muted" id="r-count">Sal al ver la flecha, corre 2-4 m, frena y vuelve andando.</div><button class="ghostbtn" data-act="react-close" style="max-width:260px">Cerrar</button>`;
  $("#layer").appendChild(el);
  const alive=()=>document.body.contains(el), main=el.querySelector("#r-main"), cnt=el.querySelector("#r-count");
  let k=0, prev=-1;
  const wait=()=>{if(!alive())return; if(k>=n){main.innerHTML="Hecho 👍";cnt.textContent="Apunta la serie y descansa.";return}
    main.innerHTML='<span style="font-size:64px;opacity:.35">· · ·</span><span style="font-size:22px" class="muted">Atento…</span>';
    setTimeout(show,1500+Math.random()*2500)};
  const show=()=>{if(!alive())return; let i;do{i=Math.floor(Math.random()*DIRS.length)}while(i===prev); prev=i; const d=DIRS[i]; k++;
    main.innerHTML=`<span style="font:700 min(55vw,260px)/1.15 system-ui,sans-serif;color:var(--ball)">${d.a}</span><span style="font-size:30px;margin-top:16px">${d.t}</span>`;
    cnt.textContent=`Salida ${k} de ${n}`; ping(); vibrate(80);
    setTimeout(()=>{if(!alive())return; main.innerHTML='<span style="font-size:26px" class="muted">Frena, vuelve andando<br>y ponte en posición</span>'; setTimeout(wait,6500)},1300)};
  setTimeout(wait,3000);
}

/* ============ EVENTOS ============ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-tab],[data-lift],[data-body],[data-step],[data-rpe],[data-reason],[data-video]"); if(!t)return;
  if(t.dataset.body){bodySel=t.dataset.body;render();return}
  if(t.dataset.video){openVideo(t.dataset.video);return}
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  if(t.dataset.lift){liftSel=t.dataset.lift;render();return}
  if(t.dataset.step){const m=t.dataset.step;P.vals[m]=Math.max(0,Math.round(((P.vals[m]||0)+STEP[m]*(+t.dataset.d))*10)/10);$("#v-"+m).textContent=fmtNum(P.vals[m]);vibrate(8);return}
  if(t.dataset.rpe){F.rpe=+t.dataset.rpe;document.querySelectorAll("[data-rpe]").forEach(b=>b.setAttribute("aria-pressed",b===t));$("#rpe-txt").textContent=rpeText(F.rpe);$("#f-load").textContent=F.rpe*(parseInt($("#f-min").value,10)||0);return}
  if(t.dataset.reason){F.reason=t.dataset.reason;document.querySelectorAll("[data-reason]").forEach(b=>{const on=b===t;b.style.background=on?"var(--ball)":"var(--surface)";b.style.color=on?"var(--ballInk)":"var(--muted)"});return}
  switch(t.dataset.act){
    case "start":startSession();break;
    case "close":closePlayer();break;
    case "go":go();break;
    case "done":completeSet();break;
    case "rest-add":P.restEnd+=15000;P.restTotal+=15;tick();break;
    case "rest-skip":P.restEnd=0;$("#rest")?.remove();break;
    case "exit":openExit();break;
    case "exit-partial":$("#exit")?.remove();openFinish(true);break;
    case "exit-discard":S.sessions=S.sessions.filter(s=>s.id!==P.sid);S.sets=S.sets.filter(s=>s.sid!==P.sid);save();closePlayer();render();break;
    case "exit-cancel":$("#exit")?.remove();break;
    case "save":saveSession();break;
    case "import":openImport();break;
    case "imp-close":$("#imp")?.remove();break;
    case "imp-go":{const err=importHealth($("#imp-txt").value);if(err){$("#imp-err").textContent=err}else{$("#imp").remove();render()}break}
    case "export":exportData();break;
    case "backup":backup();break;
    case "body-save":{const r={d:new Date().toISOString()};let ok=false,bad=false;BODYM.forEach(m=>{const v=$("#b-"+m.id).value.trim().replace(",",".");if(v){if(isFinite(+v)&&+v>0){r[m.id]=+v;ok=true}else bad=true}});
      if(bad||!ok){toast("Escribe al menos un número");break}if(r.fat!=null&&r.fat>60){toast("La grasa va en %, por ejemplo 23,5");break}addBody([r]);save();toast("Medida guardada");render();break}
    case "react":openReaction(P&&P.steps[P.i]?.e?.defaults?.reps||4);break;
    case "react-close":$("#react")?.remove();break;
    case "test-save":{const id=t.dataset.id,v=$("#t-"+id).value.trim().replace(",",".");if(!v||!isFinite(+v)){toast("Escribe un número");break}S.tests=S.tests||{};(S.tests[id]=S.tests[id]||[]).push({d:new Date().toISOString(),v:+v});save();toast("Test guardado");render();break}
    case "video-close":$("#video")?.remove();break;
    case "video-save":{const v=ytId($("#vid-url").value.trim());if(!v){toast("Ese enlace no parece de YouTube");break}S.videos=S.videos||{};S.videos[t.dataset.id]=v;save();$("#video")?.remove();openVideo(t.dataset.id);toast("Vídeo guardado");break}
    case "video-reset":{if(S.videos)delete S.videos[t.dataset.id];save();$("#video")?.remove();openVideo(t.dataset.id);break}
    case "toggle-compete":setDayOpt("compete",!dayOpts().compete);render();break;
    case "toggle-short":setDayOpt("short",!dayOpts().short);render();break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="f-partial"){$("#reasons").style.display=e.target.checked?"":"none";$("#fin-title").textContent=e.target.checked?"Sesión parcial":"Sesión terminada"}
  if(e.target.id==="f-min"&&F){$("#f-load").textContent=F.rpe*(parseInt(e.target.value,10)||0)}
  if(e.target.id==="imp-txt")$("#imp-err").textContent="";
  if(e.target.id==="restore"&&e.target.files[0])restore(e.target.files[0]);
  if(e.target.id==="f-knee"){$("#f-knee-v").textContent=e.target.value;$("#f-knee-v").style.color=+e.target.value>=4?"var(--warn)":""}
});
function openExit(){
  const el=document.createElement("div"); el.className="sheet"; el.id="exit";
  el.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-label="Terminar la sesión"><h2 class="title" style="font-size:28px">¿Terminar la sesión?</h2>
   <button class="ballbtn" style="font-size:18px" data-act="exit-partial">Guardar como sesión parcial</button>
   <button class="ghostbtn" style="color:var(--heart)" data-act="exit-discard">Descartar sesión</button>
   <button class="ghostbtn" data-act="exit-cancel">Seguir entrenando</button></div>`;
  $("#layer").appendChild(el);
}

/* Importación directa desde el atajo: plan-padel/#importar=<datos> (el fragmento no sale del móvil) */
(function(){const h=location.hash;if(h.startsWith("#importar=")){try{const err=importHealth(decodeURIComponent(h.slice(10)));if(err)toast(err)}catch(e){}history.replaceState(null,"",location.pathname)}})();
/* Sin conexión (solo cuando está publicada como web) */
if("serviceWorker" in navigator&&location.protocol==="https:"&&!location.hostname.endsWith("claude.ai")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
render();
</script>
