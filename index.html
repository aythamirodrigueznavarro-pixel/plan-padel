<head>

<title>Plan Pádel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Plan Pádel">
<meta name="theme-color" content="#080e1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* "Pista de noche": tema oscuro único y deliberado. Azul césped = información; amarillo pelota = lo que se toca.
   Layout: app de una columna (máx. 520px), pestañas fijas abajo, modo sesión a pantalla completa por encima. */
:root{
  --ink:#080e1a; --surface:#111929; --surface2:#1a243a; --line:rgba(255,255,255,.07);
  --court:#3f7df4; --ball:#d9ea4c; --ballInk:#1a220a; --text:#ecf0f7; --muted:#92a0bb;
  --ok:#52cf90; --warn:#f5a844; --heart:#fa6672;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",-apple-system,system-ui,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--text)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ball);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:12px calc(100px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big{font:800 46px/1 var(--display);letter-spacing:.005em;margin:2px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.ballbtn{width:100%;padding:17px;border-radius:18px;background:var(--ball);color:var(--ballInk);font:800 22px var(--display);letter-spacing:.04em;text-transform:uppercase;transition:transform .15s}
.ballbtn:active{transform:scale(.97)}
.ghostbtn{padding:14px;border-radius:16px;background:var(--surface2);font-weight:600;width:100%}
.title{font:800 34px/1.02 var(--display);margin:0;text-wrap:balance}
.h3{font:800 20px var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}

/* Fase ATR */
.atr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.atr div{background:var(--surface);border-radius:14px;padding:10px 12px;color:var(--muted);font-size:11px;font-weight:500}
.atr b{display:block;font:800 26px/1 var(--display)}
.atr .on{background:var(--court);color:var(--ink)}
.weeks{display:flex;align-items:center;gap:8px;margin-top:10px}
.weeks i{flex:1;height:4px;border-radius:4px;background:var(--surface2)}
.weeks i.on{background:var(--court)}

/* Salud */
.health{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric b{font:700 22px var(--body);font-variant-numeric:tabular-nums}
.metric small{font-size:10px;font-weight:600;color:var(--muted);margin-left:2px}
.metric div{font-size:11px;font-weight:500;margin-top:1px}

/* Bloques */
.ex-row{display:grid;grid-template-columns:8px 1fr 32px;gap:12px;align-items:start;padding:6px 0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--court);margin-top:8px}
.play{width:32px;height:32px;border-radius:50%;background:var(--ball);color:var(--ballInk);display:grid;place-items:center;text-decoration:none}
.play svg{width:12px;height:12px}
.last{font-size:12px;color:var(--ball);opacity:.85}

/* Semana */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;margin-top:6px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;gap:2px}
.bar i{display:block;border-radius:5px}
.bar span{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.day{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:12px;border-radius:16px;align-items:start}
.day.today{background:rgba(26,36,58,.7)}
.day .d{text-align:center}
.day .d small{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.day .d b{font:700 24px var(--body);font-variant-numeric:tabular-nums}

/* Progreso */
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.hscroll::-webkit-scrollbar{display:none}
.best{display:flex;align-items:baseline;gap:6px}
.best b{font:700 48px var(--body);font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}

/* Pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(17,25,41,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--ball)}

/* Pantallas superpuestas */
.overlay{position:fixed;inset:0;z-index:40;background:var(--ink);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up .3s ease}
.overlay .inner{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:16px;height:16px}
.topbar{display:flex;align-items:center;justify-content:space-between}
.prog{display:flex;gap:3px;margin-top:14px}
.prog i{flex:1;height:5px;border-radius:5px;background:var(--surface2)}
.prog i.done{background:var(--court)}
.prog i.now{background:var(--ball)}
.scroll{flex:1;overflow-y:auto;min-height:0;padding:18px 0 8px;scrollbar-width:none}
.exname{font:800 42px/1 var(--display);margin:6px 0 8px;text-wrap:balance}
.vid{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--ball);color:var(--ballInk);font-weight:600;font-size:14px;text-decoration:none}
.vid svg{width:12px;height:12px}
.stepper{display:grid;grid-template-columns:auto 1fr 46px minmax(64px,auto) 46px;align-items:center;gap:8px;padding:6px 0}
.stepper .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stepper .lab small{display:block;font-size:10px;font-weight:500;letter-spacing:0;text-transform:none}
.stepper button{width:50px;height:50px;border-radius:14px;background:var(--surface2);font-size:24px;font-weight:600}
.stepper button:active{background:#25324e}
.stepper output{font:700 40px var(--body);font-variant-numeric:tabular-nums;min-width:92px;text-align:center}
.rest{position:fixed;inset:0;z-index:50;background:rgba(8,14,26,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ring{position:relative;width:240px;height:240px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring output{position:absolute;inset:0;display:grid;place-items:center;font:700 64px var(--body);font-variant-numeric:tabular-nums}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet .panel{background:var(--surface);width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;border-radius:26px 26px 0 0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;animation:up .3s ease}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe button{padding:12px 0;border-radius:12px;background:var(--surface2);font:700 22px var(--body)}
.rpe button[aria-pressed="true"]{background:var(--court);color:var(--ink)}
.field{background:var(--surface2);border-radius:16px;padding:12px 14px;min-width:0}
.field input[type=date],.field input[type=time]{font-size:16px;min-width:0;-webkit-appearance:none;appearance:none}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field textarea{width:100%;background:none;border:0;outline:0;padding:2px 0}
.field input{font:700 28px var(--body);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--surface2);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;animation:up .25s ease}
/* Récord, resumen y anillos */
.pr-banner{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:120;width:min(92vw,420px);box-sizing:border-box;background:linear-gradient(135deg,#f7d95c,#d9ea4c 55%,#f5a844);color:#1a220a;padding:12px 18px;border-radius:18px;box-shadow:0 12px 40px rgba(217,234,76,.35);font:800 20px var(--display);letter-spacing:.02em;text-transform:uppercase;display:flex;gap:10px;align-items:center;max-width:92vw;animation:prIn .5s cubic-bezier(.2,1.4,.4,1)}
.pr-banner small{display:block;font:600 13px var(--body);text-transform:none;letter-spacing:0;opacity:.85}
@keyframes prIn{from{transform:translate(-50%,-40px) scale(.8);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}
.summary{position:fixed;inset:0;z-index:75;overflow-y:auto;background:radial-gradient(120% 70% at 50% 0%,#17306b 0%,#0b1630 45%,var(--ink) 100%);display:flex;flex-direction:column;align-items:center;gap:16px;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));animation:fade .3s ease}
.summary .inner{width:100%;max-width:460px;display:flex;flex-direction:column;gap:16px}
.summary h2{font:800 46px/1 var(--display);text-transform:uppercase;margin:0;letter-spacing:.01em}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sgrid div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:14px;animation:up .5s ease both}
.sgrid b{display:block;font:800 38px/1 var(--display);font-variant-numeric:tabular-nums}
.sgrid span{font-size:12px;color:var(--muted);font-weight:600}
.prlist{background:linear-gradient(135deg,rgba(247,217,92,.16),rgba(245,168,68,.10));border:1px solid rgba(247,217,92,.35);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;animation:up .6s .2s ease both}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:76}
.rings{display:flex;align-items:center;gap:18px}
.rings svg{flex:none;width:118px;height:118px;transform:rotate(-90deg)}
.ring-p{transition:stroke-dashoffset 1.3s cubic-bezier(.3,.9,.3,1)}
.rl{display:flex;flex-direction:column;gap:9px;min-width:0}
.rl div{display:flex;flex-direction:column}
.rl b{font:700 18px var(--body);font-variant-numeric:tabular-nums}
.rl span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.report{position:fixed;inset:0;z-index:78;overflow-y:auto;background:var(--ink);padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));animation:fade .25s ease}
.report .rp{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.report section{display:flex;flex-direction:column;gap:8px}
.report h3{font:700 16px var(--body);margin:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div,.rbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.kpis b{display:block;font:800 26px/1.1 var(--display)}
.kpis span{font-size:11px;color:var(--muted);font-weight:600}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.tbl table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:600;font-size:11px}
.tbl td.lo{color:#fa6672;font-weight:700}
.tbl table.acts td:nth-child(2),.tbl table.acts th:nth-child(2){text-align:left}
@media print{
  @page{margin:14mm}
  body{background:#fff!important}
  body>*:not(#report){display:none!important}
  #report{position:static;inset:auto;overflow:visible;background:#fff!important;color:#111!important;padding:0}
  #report *{color:#111!important;border-color:#ccc!important}
  #report .kpis div,#report .rbox{background:#f5f6f8!important}
  #report .noprint{display:none!important}
  #report td.lo{color:#c0263a!important}
  #report section{break-inside:avoid}
}
.sheet .panel>*{flex-shrink:0}
.field input[type=date],.field input[type=time]{font-size:17px!important;font-weight:600!important;min-width:0;width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<main class="wrap" id="view" aria-live="polite"></main>

<div id="layer"></div>

<script>
/* ============ PLAN · BLOQUE 1 (4 semanas desde el lunes 23-11-2026) ============
   Hecho a partir de tus registros reales con Marcfit, solo con el material de tu gimnasio
   (cardio: cinta, elíptica y bici estática) y con la rodilla derecha en mente.
   Semana 1: aprendes los pesos (RIR +1) · Semana 2: la que está escrita · Semana 3: la más dura (RIR −1)
   Semana 4: descarga (una serie menos y RIR +2). */
const PHASES=[{k:"A",n:"Acumulación",g:"Base: fuerza en tus ejercicios ancla, rodilla y aeróbico"},{k:"T",n:"Transformación",g:"Convertir la base en potencia y velocidad"},{k:"R",n:"Realización",g:"Intensidad de partido, menos volumen"}];
const BLOCK_START=new Date(2026,10,23);
const WEEK_INFO={1:{t:"Semana 1 · aprendes los pesos",rir:1,sets:0},2:{t:"Semana 2 · carga normal",rir:0,sets:0},3:{t:"Semana 3 · la más exigente",rir:-1,sets:0},4:{t:"Semana 4 · descarga",rir:2,sets:-1}};
function blockWeekRaw(d=new Date()){return Math.floor(Math.round((monday(d)-monday(BLOCK_START))/86400000)/7)+1}
function blockWeek(d=new Date()){const days=Math.round((monday(d)-monday(BLOCK_START))/86400000);return Math.min(4,Math.max(1,Math.floor(days/7)+1))}
const BLOCK={phase:"A",get week(){return blockWeek()},weeks:4};

/* presc admite {S} (series de esa semana) y {R} (RIR de esa semana) */
const ex=(id,name,presc,cue,video,sets,metrics,defaults,rest,barbell=false,opt={})=>({id,name,presc,cue,video,sets,metrics,defaults,rest,barbell,...opt});
const WARMUP=[
 {id:"cal",title:"Calentamiento competitivo · 8 min",note:"Antes de pelotear",ex:[
  ex("cal-movil","Movilidad dinámica","Cadera, tobillo y hombro · 2 min","Todo en movimiento, nada de estiramientos quietos.","padel dynamic warm up",1,["seg"],{seg:120},0),
  ex("cal-activ","Activación","10 sentadillas + 10 zancadas + 10 W con goma","Ritmo vivo.","dynamic warm up squat lunge",1,["reps"],{reps:30},0),
  ex("cal-chispa","Chispa","3 salidas laterales + 3 saltos + 3 frenadas por lado","Cada vez más rápido. Termina con pulsaciones altas.","padel warm up footwork",1,["reps"],{reps:9},0)]},
 {id:"post",title:"Después del partido · 10 min",note:"Nada más salir de la pista",ex:[
  ex("post-lumbar","Descarga lumbar","Rodillas al pecho y rotaciones tumbado · 3 min","Respira lento.","lower back decompression after sport",1,["seg"],{seg:180},0),
  ex("post-rodillo","Rodillo","Gemelos, cuádriceps y glúteo · 5 min","Sin buscar dolor.","foam roll after match",1,["seg"],{seg:300},0)]}];

const SESSION_A={id:"A",wd:1,title:"A · Pierna: primer paso, fuerza y rodilla",sub:"La sesión más pesada de la semana. Si hoy juegas, que sea a las 20:00, nunca a mediodía.",kinds:["gym"],gym:55,padel:0,rpe:[7,8],warn:"Pierna pesada y saltos: mide la glucosa antes de empezar.",blocks:[
 {id:"a0",title:"Calentamiento",note:"1 vuelta · 7 min",ex:[
  ex("a-bici","Bici estática","2 min suave","Pedalea fácil, que puedas hablar.","stationary bike warm up",1,["seg"],{seg:120},0),
  ex("a-tobillo","Movilidad de tobillo con goma","10 por pierna","Rodilla hacia delante sin levantar el talón.","ankle mobility band knee to wall",1,["reps"],{reps:10},0),
  ex("a-9090","Cadera 90/90","6 cambios por lado","El giro sale de la cadera, espalda recta.","90 90 hip switch mobility",1,["reps"],{reps:6},0),
  ex("a-monster","Paso lateral con goma (monster walk)","10 pasos por lado","Goma por encima de las rodillas. Las rodillas empujan hacia fuera: así se activa el glúteo medio, que sujeta tu rótula.","monster walk band glute medius",1,["reps"],{reps:10},0)]},
 {id:"a0b",title:"Primer paso y rampa",note:"Superserie · 3 rondas · con las piernas frescas",ex:[
  ex("lateral-sprint","Salida desde la posición de espera","{S} × 3 salidas de 3-5 m: al frente, lateral y en diagonal hacia atrás","Como en la red: split-step y primer paso explosivo. Cada salida al 100 % y vuelves andando. Así se gana el 80 % de los desplazamientos del pádel, que son de 1-2 m.","lateral shuffle to sprint drill",3,["reps"],{reps:3},15),
  ex("sprint-rampa","Sprint en rampa","{S} × 1 de 10 m cuesta arriba","Marca 10 m en tu rampa (tiene más de 20). Cuerpo inclinado, empuja el suelo hacia atrás con pasos potentes. Vuelve andando despacio.","hill sprint acceleration",3,["reps"],{reps:1},45)]},
 {id:"a1",title:"Fuerza + salto",note:"Contraste · 4 rondas",ex:[
  ex("sentadilla","Sentadilla trasera","{S} × 5 · RIR {R}","Con barra libre en la jaula y las barras de seguridad un poco por debajo de tu sentadilla. Baja controlado, rodillas en la línea de los pies y sube rápido. Apunta solo los discos.","back squat technique",4,["kg","reps","RIR"],{kg:40,reps:5,RIR:3},20,true),
  ex("a-cajon","Salto al cajón","{S} × 3 · máxima altura","Cae suave sobre el cajón, rodillas hacia fuera. Baja andando, no saltando.","box jump landing technique",4,["reps"],{reps:3},120)]},
 {id:"a2",title:"Cadena posterior",note:"Superserie · 3 rondas",ex:[

/* Ajusta una sesión a la semana del bloque, a la versión corta y al «compito mañana» */
function materialize(day,date=new Date(),opts={}){
  const w=blockWeek(date), W=WEEK_INFO[w];
  let base=day;
  if(day.id==="D"&&opts.compete)base=ACTIVATION;
  let blocks=base.blocks.map(b=>({...b,ex:b.ex.map(e=>{
    const multi=e.sets>1;
    const sets=multi?Math.max(1,e.sets+W.sets):e.sets;
    const d={...e.defaults};
    if(d.RIR!=null)d.RIR=Math.max(e.rirMin??0,d.RIR+W.rir);
    const presc=e.presc.replace("{S}",sets).replace("{R}",d.RIR??"");
    return {...e,sets,defaults:d,presc};
  })}));
  if(opts.short){
    blocks=blocks.filter((b,i)=>i===0||b.id.endsWith("1")||b.id.endsWith("2")).map(b=>({...b,ex:b.ex.map(e=>({...e,sets:Math.min(e.sets,2),presc:e.presc.replace(/^\d+ ×/,Math.min(e.sets,2)+" ×")}))}));
  }
  return {...base,blocks,week:w,weekText:W.t,short:!!opts.short};
}
/* Duración estimada: trabajo de cada serie + descansos + 20" por cambio de ejercicio + 2' por bloque */
function estimateMinutes(day){
  let s=0;
  day.blocks.forEach(b=>{s+=120;b.ex.forEach(e=>{
    const work=e.defaults.seg?e.defaults.seg:(e.defaults.reps||5)*4;
    s+=e.sets*(work+20+e.rest);
  })});
  return Math.round(s/60);
}

/* ============ RECUPERACIÓN EN EL SPA (pileta fría, sauna, jacuzzi, piscina) ============
   Evidencia: el agua fría justo después de la fuerza puede restar algo de ganancia de músculo y fuerza (metaanálisis
   Piñero 2024; Eur J Sport Sci 2023); entre partidos o antes de competir ayuda a llegar con menos dolor y fatiga
   (5-15 min a 10-15 °C). La sauna tradicional la noche antes puede quitar chispa al día siguiente. Con diabetes tipo 1,
   el calor acelera la absorción de la insulina y puede bajar la glucosa, y el sudor tapa los síntomas de una hipo. */
function recoveryCtx(now=new Date()){
  const S0=sessionsOn(now).filter(s=>s.status!=="en curso"), gymS=S0.find(s=>GYM_IDS.includes(gymIdOf(s))||s.dayId==="D-act");
  const pad=workoutsOn(now).filter(w=>w.padel&&new Date(w.start)<=now);
  const ends=[...S0.map(s=>+new Date(s.start)+(s.minutes||0)*6e4),...pad.map(w=>+new Date(w.start)+w.minutes*6e4)];
  const tom=addDays(now,1), compToday=!!compOn(now), compTom=!!compOn(tom);
  const padTom=weekPlanned(monday(tom))?padOn(tom).length>0:DAYS[(tom.getDay()+6)%7].kinds.includes("padel");
  const st=weekState(now), tWd=(tom.getDay()+6)%7+1, gymTom=tWd<=5&&tWd>st.todayWd?planWeek(now).plan[tWd]:null;
  const legsLow=pad.some(w=>w.legs!=null&&w.legs<=2);
  return {gym:gymS?gymIdOf(gymS):null,legs:gymS&&LEGS.has(gymIdOf(gymS)),pad,padMin:pad.reduce((a,w)=>a+w.minutes,0),end:ends.length?Math.max(...ends):null,compToday,compTom,padTom,gymTom,legsLow};
}
function recoveryPlan(c){
  const cold=c.compToday||c.compTom||(c.pad.length&&(!c.gym||c.compTom)&&(c.padTom||c.legsLow||c.padMin>=100||LEGS.has(c.gymTom||"")));
  const noCold=c.gym&&!c.compTom&&!c.compToday;
  const steps=[], tip=[];
  if(cold&&!noCold){
    steps.push({m:10,t:"Pileta fría",d:"En la primera hora después de jugar. 2-3 entradas de 2-3 minutos hasta el pecho (unos 10 minutos en total), con 1 minuto fuera entre medias. Respira despacio."});
    steps.push({m:5,t:"Ducha templada",d:"Para entrar en calor poco a poco. Nada de sauna justo después del frío."});
    steps.push({m:10,t:"Caminar en la piscina (opcional)",d:"Donde hagas pie, paso tranquilo. Suelta las piernas sin cargarlas."});
    tip.push(c.compTom?"Mañana compites: hoy manda llegar fresco. Esta noche, nada de sauna (puede quitarte chispa mañana).":"Mañana vuelves a jugar o a cargar pierna: el frío te ayuda a llegar con menos dolor.");
  }else if(c.gym){
    steps.push({m:0,t:"Sin pileta fría hoy",d:`Acabas de hacer fuerza${c.pad.length?" y después pádel":""}: el agua fría en las horas siguientes puede restar algo de lo que ganas en músculo y fuerza. Hoy, mejor calor suave.`});
    steps.push({m:12,t:"Jacuzzi o sauna",d:"Una de las dos: jacuzzi 10-15 minutos, o sauna 1-2 rondas de 8-10 minutos con ducha templada entre medias. Sal antes si te mareas."});
    steps.push({m:10,t:"Caminar en la piscina (opcional)",d:"Donde hagas pie, 10 minutos suaves. Recupera sin cargar."});
    if(c.legs)tip.push("Hoy fue pierna: si mañana sigues muy cargado, mañana sí puedes usar la pileta fría (a esas horas ya no frena lo ganado).");
  }else if(c.pad.length){
    steps.push({m:12,t:"Jacuzzi o sauna (opcional)",d:"Para relajarte: jacuzzi 10-15 minutos o sauna 1-2 rondas de 8-10 minutos."});
    steps.push({m:10,t:"Caminar en la piscina (opcional)",d:"Donde hagas pie, 10 minutos suaves."});
    tip.push("Si tienes las piernas cargadas o mañana juegas, cambia el calor por la pileta fría (10 minutos).");
  }
  return {steps,tip};
}
const RECOV_GLU="🩸 Glucosa: mírala antes de entrar y al salir, y otra vez 1 hora después. El calor (sauna y jacuzzi) acelera la absorción de la insulina y te puede bajar, y el sudor y el mareo del calor se parecen a una hipo. No entres si vas bajo o bajando: sigue tu pauta. Lleva hidratos rápidos y no te quedes solo. Con mucho calor, el sensor puede leer mal un rato: si dudas, pincha el dedo. Bebe medio litro de agua.";
function recoveryCard(){
  const now=new Date(), c=recoveryCtx(now);

  return `<section class="card" style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow" style="color:var(--court)">Tu recuperación en el spa</div>
    ${rows}
    ${r.tip.map(x=>`<p class="small" style="margin:0;color:var(--ball)">${esc(x)}</p>`).join("")}
    <p class="small" style="margin:0">${esc(RECOV_GLU)}</p>

}

function dailyCard(st){
  if(st.todayWd>5||st.doneToday)return "";
  const now=new Date(), d=today(), gid=gymIdOf({dayId:d.id});
  if(!GYM_IDS.includes(gid)||(st.doneIds.has(gid)&&st.doneToday!==gid))return "";
  if(workoutsOn(now).some(w=>w.padel&&new Date(w.start)<=now))return ""; /* ya jugó: lo cuenta «Hoy ya jugaste» */
  const o=dayOpts(), legs=LEGS.has(gid);
  let ms=o.matchSoon, later=!!o.matchLater, planTxt="";
  if(ms===undefined&&weekPlanned(st.m)&&!o.ask){ /* ya lo dijiste en el planificador */
    const nx=padOn(now).find(p=>new Date(localKey(now)+"T"+p.h+":00")-now>-2*36e5);
    if(nx){const dt=new Date(localKey(now)+"T"+nx.h+":00")-now;ms=dt<6*36e5;later=!ms;planTxt=`Según tu semana, hoy tienes ${esc(PADK[nx.kind]||"pádel").toLowerCase()} a las ${esc(nx.h)}. `}
    else{ms=false;later=false;planTxt="Según tu semana, hoy no tienes pádel. "}}
  if(ms===undefined)return askDayHtml("Tu día",`Hoy toca <b>${esc(d.title)}</b>. Para recomendarte bien:`);
  const chip=`<div><button class="chip" style="background:var(--surface2);color:var(--muted)" data-act="${planTxt?"match-ask":"match-reset"}">${planTxt?"¿Ha cambiado algo? Cuéntamelo":"Cambiar mi respuesta"}</button></div>`;
  const card=(t,body)=>`<section class="card coach" style="display:flex;flex-direction:column;gap:8px"><div class="eyebrow" style="color:var(--ball)">${t}</div>${body}${chip}</section>`;
  if(ms===true&&legs){
    const {plan}=planWeek(now), pick=plan[st.todayWd];
    const alt=pick&&pick!==d.id?pick:GYM_IDS.find(id=>!LEGS.has(id)&&natWd(id)>st.todayWd&&!st.doneIds.has(id)&&!st.skipped.has(id));
    return card("Hoy juegas pronto",`<p style="margin:0">${planTxt}Juegas en menos de 6 horas: <b>hoy nada de pierna</b>. Llegarías al partido con las piernas cargadas y lo notarías en pista.</p>
      ${alt?`<button class="ballbtn" style="font-size:18px;padding:13px" data-act="plan-apply" data-id="${alt}">Adelantar la ${alt} (tren superior)</button>`:""}
      <button class="${alt?"ghostbtn":"ballbtn"}" style="font-size:${alt?16:18}px;padding:13px" data-act="plan-apply" data-id="X">Hoy, solo movilidad (20')</button>
      <p class="small muted" style="margin:0">${st.todayWd===5?`Esta semana ya no da tiempo a recuperar la ${gid}, y no pasa nada: el lunes empieza otra.`:`La ${gid} no se pierde: mañana, al abrir la app, te la coloco donde mejor encaje.`}</p>${endoBox("padel")}`);
  }
  const msg=planTxt+(ms===true?`Hoy toca tren superior, así que puedes jugar sin problema. Deja un rato entre el gimnasio y el partido (mejor 2 horas o más) y <b>mide la glucosa antes de jugar</b>.`
    :later?(legs?`Perfecto: haz la ${gid} por la mañana y deja 6 horas o más hasta el partido. <b>Mide la glucosa antes de jugar</b>: después de pierna puede bajar.`:`Perfecto: entrena con normalidad y <b>mide la glucosa antes de jugar</b>.`)
    :(legs?`Día ideal para la pierna: sin partido, puedes darlo todo en la ${gid}.`:`Sin partido hoy: entrena tranquilo la ${gid}.`));
  return card("Tu día",`<p style="margin:0">${msg}</p>${ms===true||later?endoBox("padel"):""}`);
}

    <div>${rows.join("")}</div>

/* ============ ANILLOS DE LA SEMANA ============ */
function weekRings(){
  const m=monday(), now=new Date();
  const gym=S.sessions.filter(s=>s.status!=="en curso"&&new Date(s.start)>=m&&GYM_IDS.includes(gymIdOf(s))).length;
  const padel=realWorkouts().filter(w=>w.padel&&new Date(w.start)>=m).reduce((a,w)=>a+w.minutes,0);
  const body=(S.body||[]).filter(b=>new Date(b.d)>=m).length;
  const R3=[{v:gym,max:4,c:"#3f7df4",n:"Gimnasio",u:`${gym}/4 sesiones`},{v:padel,max:270,c:"#d9ea4c",n:"Pádel",u:`${padel}/270 min`},{v:body,max:2,c:"#52cf90",n:"Cuerpo",u:`${body}/2 medidas`}];
  const rad=[50,38,26], sw=10;
  const svg=`<svg viewBox="0 0 120 120" aria-hidden="true">${R3.map((r,i)=>{const C=2*Math.PI*rad[i],k=Math.min(1,r.v/r.max);
    return `<circle cx="60" cy="60" r="${rad[i]}" fill="none" stroke="${r.c}" stroke-opacity=".16" stroke-width="${sw}"/><circle class="ring-p" cx="60" cy="60" r="${rad[i]}" fill="none" stroke="${r.c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" data-off="${(C*(1-k)).toFixed(1)}"/>`}).join("")}</svg>`;
  const done=gym>=4&&padel>=270&&body>=2;
  return `<section class="card" aria-label="Tu semana en anillos"><div class="rings">${svg}<div class="rl">${R3.map(r=>`<div><span style="color:${r.c}">${r.n}</span><b>${r.u}</b></div>`).join("")}</div></div>
   ${done?'<div class="small" style="margin-top:10px;color:var(--ball);font-weight:600">🔥 Semana redonda: los tres anillos cerrados.</div>':padel===0&&!S.health.workouts.length?'<div class="small muted" style="margin-top:10px">El pádel se llena cuando apuntas tus partidos con «🎾 Apuntar pádel», más abajo en esta pantalla.</div>':""}</section>`;
}
const animateRings=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".ring-p").forEach(c=>c.style.strokeDashoffset=c.dataset.off)));

/* ============ RESUMEN DE LA SEMANA PASADA (lunes y martes) ============ */
function lastWeekCard(){
  const now=new Date(), wd=(now.getDay()+6)%7+1; if(wd>2)return "";
  const m1=monday(now), m0=addDays(m1,-7); if(m0<addDays(BLOCK_START,-1))return "";
  const ses=S.sessions.filter(s=>s.status!=="en curso"&&new Date(s.start)>=m0&&new Date(s.start)<m1&&GYM_IDS.includes(gymIdOf(s)));
  const pad=realWorkouts().filter(w=>w.padel&&new Date(w.start)>=m0&&new Date(w.start)<m1);
  const load=Math.round(loadBetween(m0,m1));
  const prs=S.sets.filter(x=>new Date(x.t)>=m0&&new Date(x.t)<m1).filter(x=>{const prev=S.sets.filter(y=>y.ex===x.ex&&new Date(y.t)<new Date(x.t)&&y.sid!==x.sid&&y.kg>0);return prev.length&&x.kg>Math.max(...prev.map(y=>y.kg))});
  const prN=new Set(prs.map(x=>x.ex)).size;
  const gl=glucoseStats(gArr().filter(g=>g.ms>=+m0&&g.ms<+m1));
  const kn=ses.map(s=>s.knee).filter(x=>x!=null), knMax=kn.length?Math.max(...kn):null;
  const B=(S.body||[]).filter(b=>b.kg!=null), w0=avg(B.filter(b=>new Date(b.d)>=addDays(m0,-7)&&new Date(b.d)<m0).map(b=>b.kg)), w1=avg(B.filter(b=>new Date(b.d)>=m0&&new Date(b.d)<m1).map(b=>b.kg));
  const verdict=ses.length>=4?"Semana completa. Así se gana en pista.":ses.length>=3?"Muy buena semana.":ses.length>=1?"Semana a medias: lo importante es no encadenar dos así.":"Semana sin gimnasio. Esta toca retomar.";
  return `<section class="card" style="display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,rgba(63,125,244,.16),rgba(217,234,76,.06))"><div class="eyebrow" style="color:var(--ball)">Tu semana pasada</div>
   <div style="font:800 26px/1.1 var(--display);text-transform:uppercase">${verdict}</div>
   <div class="sgrid" style="grid-template-columns:repeat(3,1fr)">
     <div><b style="font-size:30px">${ses.length}/4</b><span>gimnasio</span></div>
     <div><b style="font-size:30px">${pad.reduce((a,w)=>a+w.minutes,0)}'</b><span>pádel (${pad.length})</span></div>
     <div><b style="font-size:30px">${load}</b><span>carga UA</span></div></div>
   <div class="small" style="color:var(--text);display:flex;flex-direction:column;gap:4px">
     ${prN?`<span>🏆 ${prN} ${prN===1?"récord personal":"récords personales"}</span>`:""}
     ${gl?`<span>💧 ${gl.tir} % en rango · ${gl.tbr} % por debajo de 70</span>`:""}
     ${w0!=null&&w1!=null?`<span>⚖️ Peso medio ${fmtNum(Math.round(w1*10)/10)} kg (${w1-w0<=0?"":"+"}${fmtNum(Math.round((w1-w0)*10)/10)})</span>`:""}
     ${knMax!=null?`<span>🦵 Rodilla: máximo ${knMax}/10${knMax>=4?" · vigílala":""}</span>`:""}
   </div></section>`;
}

/* ============ AVISOS DEL ENTRENADOR ============ */
function coachNotes(){
  const now=new Date(), wd=(now.getDay()+6)%7+1, N=[];
  const tom=new Date(now);tom.setDate(tom.getDate()+1);
  const todayS=sessionsOn(now);
  if(blockWeekRaw(now)>=4)N.push({i:"🧭",t:blockWeekRaw(now)>4?"El bloque 1 ha terminado. Pásale tus registros a tu entrenador para montar el bloque 2 (Transformación); mientras, sigue con esta semana suave.":"Última semana del bloque 1. Antes del lunes, pásale tus registros a tu entrenador para preparar el bloque 2."});
  if(wd===7&&blockWeekRaw(tom)<=4){const w=blockWeek(tom);N.push({i:"📅",t:sameDay(tom,BLOCK_START)?`Mañana empieza el bloque 1. Semana 1: aprendes los pesos (te sobrarán repeticiones a propósito).`:`Mañana empieza la ${WEEK_INFO[w].t.toLowerCase()}.${w===4?" Descarga: menos series y más fácil, para llegar fresco al siguiente bloque.":w===3?" Es la semana más exigente: duerme bien y vigila la glucosa.":""}`})}
  const cToday=compOn(now), cNext=[1,2,3,4,5,6].map(i=>({i,c:compOn(addDays(now,i))})).find(x=>x.c&&!(cToday&&x.c.id===cToday.id));
  if(cToday)N.push({i:"🏆",t:`Hoy compites: ${cToday.name}. Nada de gimnasio: calentamiento competitivo antes de jugar. Mide la glucosa antes y entre partidos; con los nervios suele subir y después puede bajar. Si mañana repites, 10' de agua fría al terminar.`});
  else if(cNext)N.push({i:"🏆",t:`${cNext.i===1?"Mañana":"El "+addDays(now,cNext.i).toLocaleDateString("es-ES",{weekday:"long"})} tienes ${cNext.c.name}. La app ya lo tiene en cuenta: nada de pierna pesada la víspera${addDays(now,cNext.i).getDay()===6?" y el viernes, activación":""}. Duerme bien esos días.`});
  const tests=Object.values(S.tests||{}).flat().filter(x=>new Date(x.d)>=BLOCK_START);
  if(now>=BLOCK_START&&blockWeek(now)===1&&!tests.length)N.push({i:"⏱️",t:"Esta semana toca hacer los tests del bloque (salto, frenada, dominadas y 1,5 km) en un día suave. Están en Progreso.",act:"go-progreso"});
  const B=(S.body||[]).slice().sort((a,b)=>new Date(a.d)-new Date(b.d)), lastB=B.at(-1);
  if(!lastB||now-new Date(lastB.d)>5*864e5)N.push({i:"⚖️",t:"Pésate mañana al levantarte: en ayunas, después del baño y antes de beber."});
  const lastW=B.filter(b=>b.waist!=null).at(-1);
  if(wd===1&&(!lastW||now-new Date(lastW.d)>6*864e5))N.push({i:"📏",t:"Hoy es lunes: mide la cintura a la altura del ombligo, en ayunas, y apúntala en Progreso → Tu cuerpo.",act:"go-progreso"});
  const lastS=S.sessions.filter(s=>s.status!=="en curso").at(-1);
  if(lastS&&lastS.knee>=4&&now-new Date(lastS.start)<3*864e5)N.push({i:"🦵",t:`La rodilla marcó ${lastS.knee}/10 en la última sesión. Si hoy sigue molestando, nada de saltos ni frenadas; si dura más de una semana, que la vea tu fisio.`});
  if(todayS.some(s=>s.rpe>=8))N.push({i:"🌙",t:"Hoy has entrenado fuerte: vigila la glucosa esta noche y de madrugada, que es cuando suele bajar después de un entreno duro."});
  if(wd>=6)N.push({i:"🎾",t:"Si hoy juegas varios partidos o mañana repites: al terminar, 10 minutos en agua fría (10-15 °C) o ducha fría ayudan a llegar mejor al siguiente. Después de partidos sí; después del gimnasio, no."});
  if(!S.lastPhotos||now-new Date(S.lastPhotos+"T12:00:00")>28*864e5)N.push({i:"📸",t:"Toca hacer tus fotos de progreso (una vez al mes): Progreso → Fotos de progreso.",act:"go-progreso"});
  /* Glucosa después del deporte: tu patrón es pico y bajada 2-3 h después */
  const endsToday=[...todayS.map(s=>+new Date(s.start)+(s.minutes||0)*6e4),...realWorkouts().filter(w=>w.padel&&sameDay(new Date(w.start),now)).map(w=>+new Date(w.start)+w.minutes*6e4)].filter(x=>x<=+now+36e5);
  if(endsToday.length){const t=new Date(Math.max(...endsToday)+150*6e4);N.push({i:"💧",t:`Mira tu glucosa sobre las ${t.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})} (2-3 h después del deporte) y otra vez al acostarte: es cuando te suele bajar.`})}
  /* Un consejo de alimentación distinto cada día */
  const TIPS=["Proteína: apunta a 130-160 g al día. Un yogur alto en proteína o skyr de 200-250 g en el desayuno suma mucho.","Frutos secos: un puñado (25-30 g) y no más. Son sanos, pero muy calóricos.","Agua con gas: prueba esta semana mitad con gas y mitad sin gas, y sin gas antes de jugar o entrenar. Mira que el sodio sea menor de 50 mg/L.","Antes de entrenar, hidratos lentos como la manzana: te suben menos la glucosa y después te bajan menos.","Después de entrenar o jugar, algo de proteína (yogur proteico o batido) para recuperar el músculo.","Pregunta pendiente para tu endocrino: tu pauta para días de pádel largo o competición (antes, durante, después y la cena).","Duerme 7-9 horas: es lo que más recupera, y con poco sueño se acumula grasa en la barriga.","La cintura de los lunes manda: 0,5-1 cm menos al mes es el ritmo bueno."];
  const doy=Math.floor((now-new Date(now.getFullYear(),0,0))/864e5);N.push({i:"🥗",t:TIPS[doy%TIPS.length]});
  if(S.sessions.length>=3&&(!S.lastBackup||now-new Date(S.lastBackup)>14*864e5))N.push({i:"💾",t:"Hace tiempo que no guardas una copia de tus registros. Progreso → Copia de seguridad → Guardar copia.",act:"go-progreso"});
  if(!N.length)return "";
  return `<section class="card" style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow">Avisos de tu entrenador</div>
   ${N.map(n=>`<div style="display:flex;gap:10px;align-items:flex-start"><span aria-hidden="true" style="font-size:18px;line-height:1.3">${n.i}</span><div class="small" style="color:var(--text);flex:1">${esc(n.t)}${n.act?` <button class="chip" style="background:var(--surface2);color:var(--court);padding:2px 10px;margin-left:4px" data-act="${n.act}">Ir</button>`:""}</div></div>`).join("")}
  </section>`;
}

/* Carga de los últimos 7 días frente a la media semanal de las 4 semanas anteriores (agudo:crónico) */
function loadBetween(a,b){return S.sessions.filter(s=>s.status!=="en curso"&&new Date(s.start)>=a&&new Date(s.start)<b).reduce((x,s)=>x+s.rpe*s.minutes,0)
  +realWorkouts().filter(w=>new Date(w.start)>=a&&new Date(w.start)<b).reduce((x,w)=>x+w.minutes*(w.padel?(w.rpe||6):w.type==="Caminar"?2:4),0)}
function acwr(){
  const now=new Date(), a=loadBetween(addDays(now,-7),now), c=loadBetween(addDays(now,-35),addDays(now,-7))/4;
  const first=Math.min(...[...S.sessions.map(s=>+new Date(s.start)),...S.health.workouts.map(w=>+new Date(w.start))].filter(isFinite));
  if(!(c>0)||!isFinite(first)||now-first<21*864e5)return null;
  return {a:Math.round(a),c:Math.round(c),r:a/c};
}

/* ============ RÉCORDS PERSONALES ============ */
const e1rm=x=>x.kg>0&&x.reps>0?x.kg*(1+Math.min(x.reps,12)/30):0;
function checkPR(rec){
  if(!(rec.kg>0))return null;
  const prev=S.sets.filter(x=>x.ex===rec.ex&&x.sid!==rec.sid&&x.kg>0);
  if(!prev.length)return null; /* la primera vez no cuenta: no hay con qué comparar */
  const same=S.sets.filter(x=>x.ex===rec.ex&&x.sid===rec.sid&&x!==rec&&x.kg>0), all=[...prev,...same];
  const bestKg=Math.max(...all.map(x=>x.kg)), bestE=Math.max(...all.map(e1rm));
  if(rec.kg>bestKg)return `${fmtNum(rec.kg)} kg: el mayor peso que has movido aquí`;
  if(rec.reps&&e1rm(rec)>bestE+0.01)return `${fmtNum(rec.kg)} kg × ${rec.reps}: tu mejor serie`;
  return null;
}

function sessionSummary(s){
  const sets=S.sets.filter(x=>x.sid===s.id);
  const kgMoved=Math.round(sets.reduce((a,x)=>{const e=exById(x.ex);if(!x.reps)return a;return a+((x.kg||0)+(e&&e.barbell?20:0))*x.reps},0));
  const m=monday(), wk=S.sessions.filter(x=>x.status!=="en curso"&&new Date(x.start)>=m&&GYM_IDS.includes(gymIdOf(x))).length;
  return {title:s.title,date:new Date(s.start),minutes:s.minutes,rpe:s.rpe,load:s.rpe*s.minutes,sets:sets.length,
    exercises:new Set(sets.map(x=>x.ex)).size,kgMoved,prs:Object.values(Object.fromEntries(((P&&P.prs)||[]).map(p=>[p.name,p]))),partial:s.status==="parcial",gBefore:s.gBefore,gAfter:s.gAfter,week:wk};
}
let lastSummary=null;
function countUp(el,to,ms=1100){const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;if(reduce||!to){el.textContent=to.toLocaleString("es-ES");return}
  const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/ms),v=Math.round(to*(1-Math.pow(1-k,3)));el.textContent=v.toLocaleString("es-ES");if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function confetti(n=150){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c);
  const dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  const cols=["#d9ea4c","#3f7df4","#52cf90","#ffffff","#f5a844"];
  const P2=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.28,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)],ball:Math.random()<.12}));
  const t0=performance.now();
  const f=t=>{x.clearRect(0,0,W,H);P2.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;
      if(p.ball){x.beginPath();x.arc(0,0,p.r*.9,0,7);x.fill();x.strokeStyle="#fff";x.lineWidth=1.2;x.beginPath();x.arc(-p.r*.9,0,p.r*.9,-.9,.9);x.stroke()}else x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(t-t0<3200)requestAnimationFrame(f);else c.remove()};
  requestAnimationFrame(f);
}

/* Formato del atajo (una línea por dato): W|tipo|inicio|fin · P|peso|fecha · G|grasa|fecha · L|glucosa|fecha */
function parseShortcutLines(raw){
  const d={workouts:[],body:[],glucose:[]},bodyBy={};
  const num=v=>{const m=String(v||"").replace(",",".").match(/-?\d+(\.\d+)?/);return m?+m[0]:null};
  const iso=v=>{const t=new Date(String(v||"").trim());return isNaN(t)?null:t.toISOString()};
  String(raw).split(/\r?\n/).forEach(l=>{const c=l.split("|").map(x=>x.trim());const k=c[0];
    if(k==="W"&&c.length>=4){const st=iso(c[2]),en=iso(c[3]);if(st&&en)d.workouts.push({type:c[1]||"Entrenamiento",start:st,end:en})}
    else if((k==="P"||k==="G")&&c.length>=3){const t=iso(c[2]),v=num(c[1]);if(!t||v==null)return;const key=t.slice(0,16);const b=bodyBy[key]=bodyBy[key]||{t};
      if(k==="P")b.kg=/lb/i.test(c[1])?Math.round(v*0.4536*10)/10:v;else b.fat=v<1?Math.round(v*1000)/10:v}
    else if(k==="L"&&c.length>=3){const t=iso(c[2]),v=num(c[1]);if(t&&v!=null)d.glucose.push({t,v:/mmol/i.test(c[1])||v<35?Math.round(v*18):Math.round(v)})}});
  d.body=Object.values(bodyBy);return d;
}
function importHealth(raw){
  let d; const txt=String(raw||"").trim();
  if(/^PLANPADEL/i.test(txt)||/^[WPGL]\|/m.test(txt))d=parseShortcutLines(txt);
  else{try{d=JSON.parse(txt)}catch(e){return "No parecen datos del atajo. Vuelve a ejecutarlo y pega lo que copia."}}
  const gl=(d.glucose||[]).map(x=>({t:x.t||x.date,v:+(x.v??x.value)})).filter(x=>x.t&&isFinite(x.v)&&!isNaN(new Date(x.t)));
  const PADEL=/tenis|tennis|pickleball|p[aá]del|squash|raqueta/i;
  const wo=(d.workouts||[]).map(w=>{const type=String(w.type||w.name||"Entrenamiento");const start=w.start||w.startDate;const end=w.end||w.endDate;
    const minutes=Math.round(+(w.minutes??(end?(new Date(end)-new Date(start))/60000:0)));
    return {id:start+type,type:PADEL.test(type)?"Pádel":/funcional|functional|fuerza|strength/i.test(type)?"Gimnasio (funcional)":type,padel:PADEL.test(type),start,minutes,kcal:+w.kcal||null,hr:+w.hr||null}}).filter(w=>w.start&&!isNaN(new Date(w.start))&&w.minutes>0);
  const num=v=>v==null||v===""?null:(isFinite(+String(v).replace(",","."))?+String(v).replace(",","."):null);
  const bd=(d.body||[]).map(b=>({d:b.t||b.d||b.date,kg:num(b.kg??b.weight),fat:num(b.fat),skm:num(b.skm??b.muscle)})).filter(b=>b.d&&!isNaN(new Date(b.d))&&(b.kg!=null||b.fat!=null||b.skm!=null))
    .map(b=>{if(b.fat!=null&&b.fat<1)b.fat=Math.round(b.fat*1000)/10;return b});
  if(!gl.length&&!wo.length&&!bd.length)return "No hay glucosa, entrenos ni datos de la báscula en esos datos.";
  const nb=bd.length?addBody(bd):0;
  const gk=t=>{const d=new Date(t);return isNaN(d)?String(t):d.toISOString().slice(0,16)};
  const seenG=new Set(S.health.glucose.map(g=>gk(g.t))); gl.forEach(g=>{const k=gk(g.t);if(!seenG.has(k)){seenG.add(k);S.health.glucose.push({t:new Date(g.t).toISOString(),v:g.v})}}); GC=null;
  const seenW=new Set(S.health.workouts.map(w=>w.id)); wo.forEach(w=>{if(!seenW.has(w.id))S.health.workouts.push(w)});
  S.health.glucose.sort((a,b)=>new Date(a.t)-new Date(b.t)); S.health.glucose=S.health.glucose.slice(-20000); S.health.workouts=S.health.workouts.slice(-400);
  S.health.importedAt=new Date().toISOString(); save();
  toast(nb&&!gl.length&&!wo.length?`Importadas ${nb} medidas de la báscula`:`Importado: ${gl.length} glucosas, ${wo.length} entrenos${nb?` y ${nb} pesajes`:""}`); return null;
}

/* ============ GLUCOSA Y DEPORTE ============
   Glucosa: CSV de LibreView (la web de Abbott que conecta con LibreLink) o el atajo de Salud.
   Actividades: sesiones de esta app + pádel (Apple Watch o apuntado a mano). */
function parseLibreView(txt){
  const lines=txt.replace(/^﻿/,"").split(/\r?\n/);
  const split=l=>l.split(/[,;\t](?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>c.replace(/^"|"$/g,"").trim());
  let hi=lines.findIndex(l=>/(timestamp|sello de tiempo|marca de tiempo|fecha y hora)/i.test(l)&&/(gluc)/i.test(l));
  if(hi<0)return {err:"No reconozco el archivo. Descárgalo en libreview.com → Descargar datos de glucosa."};
  const H=split(lines[hi]).map(h=>h.toLowerCase());
  const iT=H.findIndex(h=>/(timestamp|sello de tiempo|marca de tiempo|fecha y hora)/.test(h));
  const iHist=H.findIndex(h=>/(historic|historial|histórico).*gluc|gluc.*(historic|historial|histórico)/.test(h));
  const iScan=H.findIndex(h=>/(scan|escaneo|lectura).*gluc|gluc.*(scan|escaneo)/.test(h));
  const mmol=[H[iHist],H[iScan]].some(h=>h&&/mmol/.test(h)), english=/device timestamp/i.test(lines[hi]);
  if(iT<0||(iHist<0&&iScan<0))return {err:"El archivo no tiene columnas de glucosa."};
  const out=[];
  for(const l of lines.slice(hi+1)){ if(!l.trim())continue; const c=split(l);
    const raw=(iHist>=0&&c[iHist])||(iScan>=0&&c[iScan])||""; let v=parseFloat(raw.replace(",","."));
    if(!isFinite(v)||v<=0)continue; if(mmol)v=Math.round(v*18);
    const m=(c[iT]||"").match(/^(\d{1,4})[-/.](\d{1,2})[-/.](\d{1,4})[ T]+(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm|a\. ?m\.|p\. ?m\.)?/i); if(!m)continue;
    let [_,a,b,cc,hh,mm,ap]=m; let y,mo,d;
    if(a.length===4){y=+a;mo=+b;d=+cc}else{y=+cc;if(+a>12){d=+a;mo=+b}else if(+b>12){mo=+a;d=+b}else if(english){mo=+a;d=+b}else{d=+a;mo=+b}}
    let h=+hh; if(ap){const pm=/p/i.test(ap); if(pm&&h<12)h+=12; if(!pm&&h===12)h=0}
    const dt=new Date(y,mo-1,d,h,+mm); if(isNaN(dt))continue; out.push({t:dt.toISOString(),v});
  }
  return out.length?{list:out}:{err:"No encontré lecturas de glucosa en el archivo."};
}
function importLibreView(txt){
  const r=parseLibreView(txt); if(r.err)return r.err;
  const gk=t=>new Date(t).toISOString().slice(0,16);
  const seen=new Set(S.health.glucose.map(g=>gk(g.t))); let n=0;
  r.list.forEach(g=>{const k=gk(g.t);if(!seen.has(k)){S.health.glucose.push(g);seen.add(k);n++}});
  S.health.glucose.sort((a,b)=>new Date(a.t)-new Date(b.t)); S.health.glucose=S.health.glucose.slice(-20000); GC=null; save();
  const a=new Date(r.list[0].t),b=new Date(r.list.at(-1).t),f=d=>d.toLocaleDateString("es-ES",{day:"numeric",month:"short"});
  return `Glucosa importada: ${n} lecturas nuevas (${f(a<b?a:b)} – ${f(a<b?b:a)})`;
}
/* Búsqueda rápida en la serie de glucosa */
let GC=null;
function gArr(){if(!GC||GC.n!==S.health.glucose.length){const a=S.health.glucose.map(g=>({ms:+new Date(g.t),v:+g.v})).filter(g=>isFinite(g.ms)&&isFinite(g.v)).sort((x,y)=>x.ms-y.ms);GC={n:S.health.glucose.length,a}}return GC.a}
function gIdx(a,ms){let lo=0,hi=a.length;while(lo<hi){const m=(lo+hi)>>1;if(a[m].ms<ms)lo=m+1;else hi=m}return lo}
function gAt(ms,tol=20*6e4){const a=gArr();if(!a.length)return null;const i=gIdx(a,ms),p=a[i-1],n=a[i];
  if(p&&n&&n.ms-p.ms<=35*6e4)return p.v+(n.v-p.v)*(ms-p.ms)/(n.ms-p.ms);
  const best=[p,n].filter(Boolean).sort((x,y)=>Math.abs(x.ms-ms)-Math.abs(y.ms-ms))[0];return best&&Math.abs(best.ms-ms)<=tol?best.v:null}
function gRange(a0,b0){const a=gArr(),i=gIdx(a,a0),r=[];for(let k=i;k<a.length&&a[k].ms<=b0;k++)r.push(a[k]);return r}
const gMin=(a,b)=>{const r=gRange(a,b);return r.length?r.reduce((m,x)=>x.v<m.v?x:m):null};
const gMax=(a,b)=>{const r=gRange(a,b);return r.length?r.reduce((m,x)=>x.v>m.v?x:m):null};

/* Partido amistoso, entreno o competición: lo que elijas manda; si no, el tipo del reloj
   (Pickleball = entreno, Squash = competición), tus fechas de competición y el jueves por la tarde (entreno). */
function padelKind(w){
  if(w.kind)return w.kind; const t=String(w.type||""), d=new Date(w.start);
  if(/pickleball/i.test(t))return "Entreno"; if(/squash|racquet|raqueta|front[oó]n/i.test(t))return "Torneo";
  if(compOn(d))return "Torneo"; if(d.getDay()===4&&d.getHours()>=15&&d.getHours()<18)return "Entreno"; return "Partido";
}
const KIND_LABEL={Partido:"Amistoso",Entreno:"Entreno",Torneo:"Competición"};
const ACT_CATS={A:{n:"Gimnasio · pierna y saltos (A)",c:"#3f7df4"},BC:{n:"Gimnasio · tren superior (B y C)",c:"#8b7cf6"},D:{n:"Gimnasio · potencia y velocidad (D)",c:"#f5a844"},
  X:{n:"Movilidad",c:"#92a0bb"},partido:{n:"Pádel · partido amistoso",c:"#d9ea4c"},entreno:{n:"Pádel · entreno con entrenador",c:"#52cf90"},torneo:{n:"Pádel · competición (torneo o liga)",c:"#fa6672"},padel:{n:"Pádel (Apple Watch)",c:"#c9e04a"}};
function activities(){
  const L=[];
  S.sessions.filter(s=>s.status!=="en curso"&&s.minutes>0).forEach(s=>{const id=gymIdOf(s);const cat=id==="A"?"A":id==="B"||id==="C"?"BC":id==="D"?"D":id==="X"?"X":null;if(!cat)return;
    L.push({cat,start:+new Date(s.start),min:s.minutes,gB:s.gBefore,gA:s.gAfter,rpe:s.rpe,label:s.title})});
  /* Pádel: lo apuntado a mano manda; un «Tenis» del reloj a menos de 1 h de uno apuntado es el mismo partido.
     Sin apuntar: el «Tenis» del jueves por la tarde es el entreno con tu entrenador; el resto, partido. */
  const manual=S.health.workouts.filter(w=>w.padel&&w.src==="manual").map(w=>+new Date(w.start));
  S.health.workouts.forEach(w=>{if(!w.padel)return;const st=+new Date(w.start);
    if(w.src!=="manual"&&manual.some(m=>Math.abs(m-st)<36e5))return;
    const cat={Partido:"partido",Entreno:"entreno",Torneo:"torneo"}[padelKind(w)]||"padel";
    L.push({cat,start:st,min:w.minutes,gB:w.gBefore,gA:w.gAfter,rpe:w.rpe,label:w.type})});
  return L.sort((a,b)=>a.start-b.start);
}
function actMetrics(x){
  const s=x.start,e=s+x.min*6e4;
  const before=gAt(s,30*6e4)??x.gB??null, end=gAt(e,25*6e4)??x.gA??null;
  const dur=gMin(s,e), durMax=gMax(s,e), post=gMin(e,e+6*36e5), postMax=gMax(e,e+2*36e5);
  const nd=new Date(e); nd.setDate(nd.getDate()+1); nd.setHours(0,0,0,0); /* la noche siguiente al final de la actividad */
  const night=gMin(+nd,+nd+6*36e5);
  const has=gRange(s-36e5,e+6*36e5).length>3;
  const lows=[dur,post].filter(Boolean).some(r=>r.v<70);
  const spike=[durMax,postMax].filter(Boolean).some(r=>r.v>250);
  return {before,end,change:before!=null&&end!=null?end-before:null,durMin:dur?.v??null,postMin:post?.v??null,nightMin:night?.v??null,has,lows,nightLow:night?night.v<70:null,spike};
}
const avg=a=>{const v=a.filter(x=>x!=null&&isFinite(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
const r0=v=>v==null?"—":String(Math.round(v));

/* Apuntar pádel a mano (si no viene del reloj) */
/* ============ SALTO CON CÁMARA LENTA (CMJ): potencia y semáforo de cansancio ============
   Altura = g·t²/8, con t = tiempo de vuelo (despegue → aterrizaje). Es el método de My Jump, validado en estudios.
   Un cambio real son ≥2 cm; un salto un 5-10 % por debajo de tu media indica piernas sin recuperar. */
const JF=[{f:8,n:"Cámara lenta (240)"},{f:4,n:"Cámara lenta (120)"},{f:1,n:"Vídeo normal"}];
let JV={f:8,url:null,t0:null,t1:null};
const jumpCm=t=>Math.round(9.81*t*t/8*1000)/10;
function jumpDays(){
  const g={};(S.jumps||[]).forEach(j=>{const k=localKey(new Date(j.d));(g[k]=g[k]||[]).push(j.cm)});
  return Object.keys(g).sort().map(k=>{const v=g[k].slice().sort((a,b)=>b-a);const top=v.slice(0,2);return {k,d:new Date(k+"T12:00:00"),v:Math.round(top.reduce((a,x)=>a+x,0)/top.length*10)/10,n:v.length,best:v[0]}});
}
function jumpStatus(){
  const days=jumpDays(), tk=localKey(new Date()), t=days.find(x=>x.k===tk);
  const from=localKey(addDays(new Date(),-35)), base=days.filter(x=>x.k!==tk&&x.k>=from);
  if(!t||base.length<3)return {today:t||null,base:base.length>=3?base:null,lvl:null};
  const b=base.reduce((a,x)=>a+x.v,0)/base.length, pct=(t.v-b)/b*100;
  return {today:t,b:Math.round(b*10)/10,pct:Math.round(pct),lvl:pct>=-5?"verde":pct>=-10?"amarillo":"rojo"};
}
function jumpTodayHtml(){
  const t=jumpDays().find(x=>x.k===localKey(new Date()));
  if(!t)return '<p class="small muted" style="margin:0">Hoy aún no has saltado.</p>';

function glucoseStats(a){if(!a.length)return null;const v=a.map(x=>x.v),n=v.length,mean=v.reduce((s,x)=>s+x,0)/n,sd=Math.sqrt(v.reduce((s,x)=>s+(x-mean)**2,0)/n);
  const pct=f=>fmtNum(Math.round(v.filter(f).length/n*1000)/10);
  return {n,mean,cv:sd/mean*100,gmi:3.31+0.02392*mean,tir:pct(x=>x>=70&&x<=180),tbr:pct(x=>x<70),tbr54:pct(x=>x<54),tar:pct(x=>x>180),tar250:pct(x=>x>250)}}
function curveSvg(groups){
  const W=340,H=210,P={l:34,r:8,t:10,b:26},x0=-60,x1=300,y0=40,y1=300;
  const X=m=>P.l+(m-x0)/(x1-x0)*(W-P.l-P.r),Y=v=>H-P.b-(Math.min(y1,Math.max(y0,v))-y0)/(y1-y0)*(H-P.t-P.b);
  const lines=groups.map(g=>{const pts=g.curve.map((v,i)=>v==null?null:[X(x0+i*15),Y(v)]);let d="",pen=false;pts.forEach(p=>{if(!p){pen=false;return}d+=(pen?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);pen=true});
    return `<path d="${d}" fill="none" stroke="${g.c}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Glucosa media alrededor de cada tipo de actividad">
   <rect x="${P.l}" y="${Y(180)}" width="${W-P.l-P.r}" height="${Y(70)-Y(180)}" fill="#52cf90" fill-opacity=".12"/>
   ${[70,180,250].map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t===70?"#fa6672":t===250?"#f5a844":"#52cf90"}" stroke-opacity=".5" stroke-dasharray="3 4"/><text x="${P.l-5}" y="${Y(t)+3}" text-anchor="end" font-size="9" fill="currentColor" opacity=".7">${t}</text>`).join("")}
   <rect x="${X(0)}" y="${P.t}" width="${X(60)-X(0)}" height="${H-P.t-P.b}" fill="currentColor" opacity=".06"/>
   ${[-60,0,60,120,180,240,300].map(m=>`<text x="${X(m)}" y="${H-8}" text-anchor="middle" font-size="9" fill="currentColor" opacity=".7">${m===0?"inicio":(m>0?"+":"")+(m/60)+"h"}</text>`).join("")}
   ${lines}</svg>`;
}

    case "export":exportData();break;
    case "backup":backup();break;
    case "body-save":{const r={d:new Date().toISOString(),src:"manual"};let ok=false,bad=false;BODYM.forEach(m=>{const v=$("#b-"+m.id).value.trim().replace(",",".");if(v){if(isFinite(+v)&&+v>0){r[m.id]=+v;ok=true}else bad=true}});
      if(bad||!ok){toast("Escribe al menos un número");break}if(r.fat!=null&&r.fat>60){toast("La grasa va en %, por ejemplo 23,5");break}addBody([r]);save();toast("Medida guardada");render();checkBadges();break}
    case "react":openReaction(P&&P.steps[P.i]?.e?.defaults?.reps||4);break;
    case "react-close":$("#react")?.remove();break;
    case "test-save":{const id=t.dataset.id,v=$("#t-"+id).value.trim().replace(",",".");if(!v||!isFinite(+v)){toast("Escribe un número");break}S.tests=S.tests||{};(S.tests[id]=S.tests[id]||[]).push({d:new Date().toISOString(),v:+v});save();toast("Test guardado");render();checkBadges();break}
    case "video-close":$("#video")?.remove();break;
    case "video-save":{const v=ytId($("#vid-url").value.trim());if(!v){toast("Ese enlace no parece de YouTube");break}S.videos=S.videos||{};S.videos[t.dataset.id]=v;save();$("#video")?.remove();openVideo(t.dataset.id);toast("Vídeo guardado");break}
    case "video-reset":{if(S.videos)delete S.videos[t.dataset.id];save();$("#video")?.remove();openVideo(t.dataset.id);break}
    case "toggle-compete":setDayOpt("compete",!effCompete());render();break;
    case "week-prev":weekOff--;render();break;
    case "week-next":weekOff++;render();break;
    case "week-now":weekOff=0;render();break;
    case "match-yes":setDayOpt("matchLater",false);setDayOpt("matchSoon",true);autoPlan();render();break;
    case "match-no":setDayOpt("matchLater",false);setDayOpt("matchSoon",false);autoPlan();render();break;
    case "match-later":setDayOpt("matchLater",true);setDayOpt("matchSoon",false);autoPlan();render();break;
    case "match-ask":setDayOpt("ask",true);render();break;
    case "match-reset":{const o=dayOpts();delete o.matchSoon;delete o.matchLater;if(o.autoSwap){delete o.swap;delete o.autoSwap}S.opts[dayKey()]=o;save();render();break}
    case "plan-apply":{const id=t.dataset.id;setDayOpt("autoSwap",false);setDayOpt("swap",id===DAYS[(new Date().getDay()+6)%7].id?null:id);render();window.scrollTo(0,0);toast(id==="X"?"Hoy, movilidad":"Hoy toca la "+id);break}
    case "skip-missed":{const st=weekState();S.skip=S.skip||{};const k=dayKey(st.m);S.skip[k]=[...new Set([...(S.skip[k]||[]),...st.missed])];save();render();toast("Vale, seguimos con lo que queda de semana");break}
    case "go-progreso":tab="progreso";render();window.scrollTo(0,0);break;
    case "share-summary":shareSummary();break;
    case "summary-close":$("#summary")?.remove();$("#confetti")?.remove();break;
    case "padel-log":openPadelLog();break;
    case "goal-waist":{const g=waistGoal();const r=prompt("¿Qué cintura quieres alcanzar (cm)?",g?fmtNum(g.target):"84");if(r==null)break;const v=parseFloat(String(r).replace(",","."));if(!isFinite(v)||v<50||v>150){toast("Escribe los cm, por ejemplo 84");break}
      S.goals=S.goals||{};S.goals.waist={start:g?g.start:v+6,target:v};save();render();break}
    case "ph-new":openPhotoNew();break;
    case "ph-close":$("#phnew")?.remove();render();break;
    case "ph-compare":openPhotoCompare();break;
    case "ph-cmp-close":$("#phcmp")?.remove();break;
    case "ph-del":{const d=t.dataset.d;if(!confirm("¿Borrar las fotos de ese día?"))break;phDel(PH.filter(p=>p.date===d).map(p=>p.id)).then(phLoad);break}
    case "help-rir":openRirHelp();break;
    case "rirhelp-close":$("#rirhelp")?.remove();break;
    case "edit-val":{const m=t.dataset.m,lab={kg:"Peso en kg"+(P.steps[P.i].e.barbell?" (solo los discos)":""),reps:"Repeticiones",RIR:"RIR: repeticiones que te quedaban",seg:"Segundos"}[m]||m;
      const r=prompt(lab,fmtNum(P.vals[m]??0));if(r==null)break;const v=parseFloat(String(r).replace(",","."));if(!isFinite(v)||v<0){toast("Escribe un número");break}
      P.vals[m]=Math.round(v*100)/100;$("#v-"+m).textContent=fmtNum(P.vals[m]);if(m==="RIR"&&$("#rir-help"))$("#rir-help").textContent=rirShort(P.vals.RIR);break}
    case "settings":openSettings();break;
    case "settings-close":$("#settings")?.remove();break;
    case "whatsnew":$("#settings")?.remove();openWhatsNew();break;
    case "whatsnew-ok":S.seenVersion=APP_VERSION;save();$("#whatsnew")?.remove();break;
    case "wipe":if(confirm("¿Borrar TODOS tus registros de este iPhone? Guarda antes una copia: no se puede deshacer.")&&confirm("¿Seguro? Se borrarán sesiones, series, pesajes, glucosa y pádel.")){S={sessions:[],sets:[],health:{glucose:[],workouts:[]},seenVersion:APP_VERSION};GC=null;save();$("#settings")?.remove();render();toast("Datos borrados")}break;
    case "resume":resumeSession(false);break;
    case "resume-finish":resumeSession(true);break;
    case "resume-discard":{const s=openSession();if(s&&confirm("¿Descartar esta sesión y sus series?")){S.sessions=S.sessions.filter(x=>x.id!==s.id);S.sets=S.sets.filter(x=>x.sid!==s.id);save();render();toast("Sesión descartada")}break}
    case "rd":{P.gText=$("#g-pre")?$("#g-pre").value:P.gText;P.rd=P.rd||{};P.rd[t.dataset.k]=+t.dataset.v;drawPre();break}
    case "pre-extra":{P.gText=$("#g-pre")?$("#g-pre").value:P.gText;const rd=P.rd;const base=today();P.day=P.day.extra?base:withExtra(base);P.steps=buildSteps(P.day);P.i=0;P.vals=prefill(P.steps[0]);P.rd=rd;drawPre();if(P.day.extra)toast("Bloque extra añadido al final");break}
    case "pre-short":{P.gText=$("#g-pre")?$("#g-pre").value:P.gText;setDayOpt("short",true);const rd=P.rd,g=P.gText;const d=today();P.day=d;P.steps=buildSteps(d);P.i=0;P.vals=prefill(P.steps[0]);P.rd=rd;P.gText=g;drawPre();toast("Versión corta");break}
    case "ex-chart":openExChart(t.dataset.id);break;
    case "exchart-close":$("#exchart")?.remove();break;
    case "padel-set":{const w=S.health.workouts.find(x=>x.id===t.dataset.id);if(w){w.kind=t.dataset.k;save();render()}break}
    case "comp-add":openCompAdd();break;
    case "comp-close":$("#compadd")?.remove();break;
    case "comp-type":CT.type=t.dataset.k;document.querySelectorAll("[data-act=comp-type]").forEach(b=>{const on=b===t;b.style.background=on?"var(--ball)":"var(--surface2)";b.style.color=on?"var(--ballInk)":"var(--muted)"});break;
    case "comp-save":saveComp();break;
    case "comp-del":S.comps=(S.comps||[]).filter(c=>c.id!==t.dataset.id);save();render();break;
    case "padel-close":$("#padellog")?.remove();break;
    case "padel-kind":PL.kind=t.dataset.k;document.querySelectorAll("[data-act=padel-kind]").forEach(b=>{const on=b===t;b.style.background=on?"var(--ball)":"var(--surface2)";b.style.color=on?"var(--ballInk)":"var(--muted)"});break;
    case "padel-save":savePadelLog();break;
    case "padel-diary":openPadelLog(t.dataset.id);break;
    case "pln-open":openPlanner(t.dataset.off);break;
    case "pln-close":$("#planner")?.remove();render();break;
    case "pln-day":PLN.wd=+t.dataset.wd;if($("#pln-h")){PLN.h=$("#pln-h").value||PLN.h;PLN.min=$("#pln-m").value||PLN.min}drawPlanner();break;
    case "pln-kind":PLN.kind=t.dataset.k;if($("#pln-h")){PLN.h=$("#pln-h").value||PLN.h;PLN.min=$("#pln-m").value||PLN.min}drawPlanner();break;
    case "pln-add":plannerAdd();break;
    case "pln-del":{const id=t.dataset.id;S.pad=(S.pad||[]).filter(x=>x.id!==id);S.comps=(S.comps||[]).filter(x=>x.id!==id);save();drawPlanner();break}
    case "pln-done":{const m=addDays(monday(),7*PLN.off);S.planned=S.planned||{};S.planned[localKey(m)]=true;save();$("#planner")?.remove();render();window.scrollTo(0,0);toast("Semana planificada: sesiones colocadas");break}
    case "spa-guide":openSpaGuide();break;
    case "spa-close":$("#spa")?.remove();break;
    case "pl-set":{const k=t.dataset.k,v=k==="res"?t.dataset.v:+t.dataset.v;PL[k]=PL[k]===v?null:v;plPaint();break}
    case "pl-fail":{const k=t.dataset.k;PL.fails=PL.fails.includes(k)?PL.fails.filter(x=>x!==k):[...PL.fails,k];plPaint();break}
    case "jump-open":if(P&&!P.start)P.gText=$("#g-pre")?$("#g-pre").value:P.gText;openJump();break;
    case "jump-close":{if(JV.url){URL.revokeObjectURL(JV.url);JV.url=null}$("#jump")?.remove();if(P&&!P.start)drawPre();else render();break}
    case "jf":JV.f=+t.dataset.f;document.querySelectorAll("[data-act=jf]").forEach(b=>{const on=+b.dataset.f===JV.f;b.style.background=on?"var(--ball)":"var(--surface2)";b.style.color=on?"var(--ballInk)":"var(--muted)"});if($("#jv")&&JV.url)jumpPaint();break;
    case "jv-step":{const v=$("#jv");if(v&&isFinite(v.duration)){v.pause();v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+(+t.dataset.s)/jumpFps()))}break}
    case "jv-mark":{const v=$("#jv");if(v){JV[t.dataset.m]=v.currentTime;jumpPaint()}break}
    case "jump-save":{const r=jumpResult();if(r&&r.ok)jumpSave(r.cm,"video");break}
    case "jump-man-save":{const v=parseFloat(($("#jump-man").value||"").replace(",","."));if(!(v>=10&&v<=90)){toast("Escribe los cm (entre 10 y 90)");break}$("#jump-man").value="";jumpSave(v,"manual");break}
    case "endo-open":if(P&&!P.start)P.gText=$("#g-pre")?$("#g-pre").value:P.gText;openEndo();break;
    case "endo-close":$("#endo")?.remove();break;
    case "endo-save":{const v=($("#endo-t").value||"").trim();S.endo=v?{txt:v,d:new Date().toISOString()}:null;save();$("#endo")?.remove();toast(v?"Pauta guardada":"Pauta borrada");if(P&&!P.start)drawPre();else render();break}
    case "padel-del":S.health.workouts=S.health.workouts.filter(w=>w.id!==t.dataset.id);save();render();break;
    case "gl-report":openReport();break;
    case "rep-days":repDays=+t.dataset.d;openReport();break;
    case "rep-close":$("#report")?.remove();break;
    case "rep-print":window.print();break;
    case "day-close":$("#dayview")?.remove();break;
    case "day-swap":setDayOpt("swap",t.dataset.id);$("#dayview")?.remove();tab="hoy";render();window.scrollTo(0,0);toast("Hoy haces esta sesión");break;
    case "day-unswap":setDayOpt("swap",null);$("#dayview")?.remove();tab="hoy";render();window.scrollTo(0,0);break;
    case "toggle-short":setDayOpt("short",!dayOpts().short);render();break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="f-partial"){$("#reasons").style.display=e.target.checked?"":"none";$("#fin-title").textContent=e.target.checked?"Sesión parcial":"Sesión terminada"}
  if(e.target.id==="f-min"&&F){$("#f-load").textContent=F.rpe*(parseInt(e.target.value,10)||0)}
  if(e.target.id==="imp-txt")$("#imp-err").textContent="";
  if(e.target.id==="restore"&&e.target.files[0])restore(e.target.files[0]);
  if(e.target.id==="jump-file"&&e.target.files[0]){jumpLoad(e.target.files[0]);e.target.value=""}
  if(e.target.id==="jv-r"){const v=$("#jv");if(v&&isFinite(v.duration)){v.pause();v.currentTime=e.target.value/1000*v.duration}}
  if(e.target.classList&&e.target.classList.contains("ph-input")&&e.target.files[0]){const pose=e.target.dataset.pose,f=e.target.files[0];
    shrink(f).then(blob=>{const date=localKey(new Date());const old=PH.find(p=>p.date===date&&p.pose===pose);return phPut({id:old?old.id:"p"+Date.now()+pose,date,pose,blob})}).then(async()=>{PH=await phAll();phURL.clear();S.lastPhotos=localKey(new Date());save();$("#phnew")?.remove();openPhotoNew();toast("Foto guardada")}).catch(()=>toast("No se pudo guardar la foto"));e.target.value=""}
  if(e.target.id==="ph-a"||e.target.id==="ph-b"){openPhotoCompare($("#ph-a").value,$("#ph-b").value)}
  if(e.target.id==="libreview"&&e.target.files[0]){const f=e.target.files[0];const r=new FileReader();r.onload=()=>{toast(importLibreView(String(r.result)));render()};r.readAsText(f);e.target.value=""}
  if(e.target.id==="renpho"&&e.target.files[0]){const f=e.target.files[0];const r=new FileReader();r.onload=()=>{const m=importRenpho(String(r.result));toast(m);render()};r.readAsText(f);e.target.value=""}
  if(e.target.id==="f-knee"){$("#f-knee-v").textContent=e.target.value;$("#f-knee-v").style.color=+e.target.value>=4?"var(--warn)":""}
});
function openExit(){
  const el=document.createElement("div"); el.className="sheet"; el.id="exit";
  el.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-label="Terminar la sesión"><h2 class="title" style="font-size:28px">¿Terminar la sesión?</h2>
   <button class="ballbtn" style="font-size:18px" data-act="exit-partial">Guardar como sesión parcial</button>
   <button class="ghostbtn" style="color:var(--heart)" data-act="exit-discard">Descartar sesión</button>
   <button class="ghostbtn" data-act="exit-cancel">Seguir entrenando</button></div>`;
  $("#layer").appendChild(el);
}

/* Importación directa desde el atajo: plan-padel/#importar=<datos> (el fragmento no sale del móvil) */
(function(){const h=location.hash;if(h.startsWith("#importar=")){try{const err=importHealth(decodeURIComponent(h.slice(10)));if(err)toast(err)}catch(e){}history.replaceState(null,"",location.pathname)}})();
/* Sin conexión (solo cuando está publicada como web) */
if("serviceWorker" in navigator&&location.protocol==="https:"&&!location.hostname.endsWith("claude.ai")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
try{if(S.body&&S.body.length){const n=S.body.length;normalizeBody();if(S.body.length!==n)save()}}catch(e){}
render();
setTimeout(()=>checkBadges(S.seenVersion!==APP_VERSION),1500);
if(S.seenVersion!==APP_VERSION)setTimeout(()=>{if(!$("#layer").children.length)openWhatsNew()},600);
</script>
